<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SYLOON · HEMA 产品开发与订单协同平台</title>
<style>
:root {
  --bg: #F3F6F4;
  --surface: #FFFFFF;
  --surface-2: #ECF2EF;
  --ink: #17362D;
  --muted: #60766F;
  --line: #D8E4DF;
  --line-dash: #C6D7D0;
  --brand: #0B8F43;
  --brand-ink: #006B3C;
  --brand-deep: #004C3F;
  --brand-soft: #E1F3E8;
  --sky: #27A98B;
  --sky-soft: #E1F4EF;
  --sky-text: #08745E;
  --mint: #54C98A;
  --mint-soft: #E0F5E9;
  --mint-text: #147A47;
  --red: #E5484D;
  --red-soft: #FDEBEC;
  --amber: #F5A524;
  --amber-soft: #FDF3DF;
  --shadow: 0 1px 2px rgba(0,76,63,.05), 0 8px 22px -12px rgba(0,76,63,.16);
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 400 15px/1.7 -apple-system, "SF Pro SC", "PingFang SC", "Hiragino Sans GB", "Source Han Sans SC", "Noto Sans CJK SC", "Microsoft YaHei", system-ui, sans-serif;
}
a { color: var(--brand-ink); text-decoration: none; }
button { font: inherit; cursor: pointer; }
input, select, textarea { font: inherit; color: var(--ink); }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 1px; border-radius: 4px; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* ---------- shell: sidebar + main ---------- */
.shell { display: flex; min-height: 100vh; }
.sidebar {
  flex: 0 0 202px;
  position: sticky;
  top: 0;
  height: 100vh;
  background:
    radial-gradient(circle at 50% 58%, rgba(0,232,91,.72) 0%, rgba(0,140,63,.2) 25%, transparent 46%),
    linear-gradient(180deg, #001610 0%, #002A20 32%, #008B3C 57%, #003D29 80%, #009546 100%);
  color: #fff;
  display: flex;
  flex-direction: column;
  padding: 0 0 16px;
  z-index: 40;
}
.side-brand {
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 800;
  font-size: 17px;
  letter-spacing: .02em;
  justify-content: center;
  height: 86px;
  padding: 0 25px;
  margin-bottom: 14px;
  border-bottom: 1px solid rgba(255,255,255,.16);
}
.logo-tag { font: 650 10.5px/1 var(--mono); letter-spacing: .1em; background: rgba(255,255,255,.18); border-radius: 999px; padding: 4px 7px; }
.side-nav { display: flex; flex-direction: column; gap: 0; }
.side-nav a {
  position: relative;
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 9px 11px;
  border-radius: 9px;
  color: rgba(255,255,255,.82);
  font-size: 14.5px;
  font-weight: 550;
}
.side-nav a svg { flex: 0 0 16px; width: 16px; height: 16px; opacity: .9; }
.side-nav a:hover { background: rgba(255,255,255,.12); color: #fff; text-decoration: none; }
.side-nav a.on { background: rgba(255,255,255,.18); color: #fff; font-weight: 700; }
.side-nav a.on::before {
  content: "";
  position: absolute;
  left: -12px;
  top: 50%;
  transform: translateY(-50%);
  width: 3px;
  height: 18px;
  border-radius: 0 3px 3px 0;
  background: #fff;
}
.side-nav a.on svg { opacity: 1; }
.side-nav a.section-link {
  justify-content: center;
  height: 58px;
  padding: 0 16px;
  border-radius: 0;
  color: rgba(255,255,255,.93);
  font-size: 15.5px;
  font-weight: 620;
  letter-spacing: .01em;
}
.side-nav a.section-link:hover { background: rgba(0,0,0,.2); color: #fff; }
.side-nav a.section-link.on { background: rgba(0,0,0,.4); color: #00EF68; font-weight: 700; }
.side-nav a.section-link.on::before { display: none; }
.side-group { display: flex; flex-direction: column; }
.side-parent .chev { margin-left: auto; font-size: 11px; opacity: .7; transition: transform .15s ease; }
.side-group.open .side-parent .chev { transform: rotate(180deg); }
.side-nav a.grp-on { color: #fff; }
.side-subs {
  display: none;
  flex-direction: column;
  gap: 1px;
  margin: 2px 0 5px 15px;
  padding-left: 10px;
  border-left: 1px solid rgba(255,255,255,.22);
}
.side-group.open .side-subs { display: flex; }
.side-nav a.sub { padding: 6.5px 9px; font-size: 13.5px; border-radius: 7px; color: rgba(255,255,255,.72); }
.side-nav a.sub.on { background: rgba(255,255,255,.2); color: #fff; font-weight: 650; }
.side-nav a.sub.on::before { display: none; }
.sub-badge {
  margin-left: auto;
  background: var(--red);
  color: #fff;
  font: 700 10.5px/1 var(--mono);
  border-radius: 999px;
  padding: 3px 6px;
}
.side-foot { margin-top: auto; padding: 12px 18px 0; }
.btn-reset {
  width: 100%;
  background: transparent;
  color: rgba(255,255,255,.85);
  border: 1px solid rgba(255,255,255,.3);
  border-radius: 8px;
  padding: 7px 10px;
  font-size: 13.5px;
}
.btn-reset:hover { background: rgba(255,255,255,.12); }
.main { flex: 1; min-width: 0; }
.mainbar {
  position: sticky;
  top: 0;
  z-index: 30;
  height: 50px;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 24px;
}
.mainbar .spacer { flex: 1; }
.mainbar select {
  background: #fff;
  color: var(--ink);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 5px 8px;
  font-size: 13.5px;
}
.mainbar select:hover { border-color: var(--brand); }
.role-badge {
  font-size: 13px;
  font-weight: 650;
  border-radius: 999px;
  padding: 4px 10px;
  background: var(--brand-soft);
  color: var(--brand-ink);
}
.role-badge.r-client { background: var(--sky-soft); color: var(--sky-text); }
.role-badge.r-manager { background: var(--mint-soft); color: var(--mint-text); }
.mainbar .today { font-size: 13px; color: var(--muted); }

/* ---------- layout ---------- */
.view { max-width: 1180px; margin: 0 auto; padding: 22px 24px 80px; }
.page-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px 16px; margin-bottom: 16px; }
.page-head h1 { margin: 0; font-size: 23px; font-weight: 750; letter-spacing: .01em; }
.page-head .sub { color: var(--muted); font-size: 14px; }
.page-head .spacer { flex: 1; }
.crumb { font-size: 13px; color: var(--muted); margin: 3px 0 10px; }
.crumb a { color: var(--muted); }
.crumb a:hover { color: var(--brand-ink); }
.crumb b { color: var(--ink); font-weight: 600; }

/* ---------- cards & stats ---------- */
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 13px;
  padding: 16px 18px;
  box-shadow: var(--shadow);
}
.card h3 { margin: 0 0 10px; font-size: 15.5px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.grid { display: grid; gap: 13px; }
.g4 { grid-template-columns: repeat(4, 1fr); }
.g3 { grid-template-columns: repeat(3, 1fr); }
.g2 { grid-template-columns: 1fr 1fr; }
.mt { margin-top: 14px; }
.statcard { padding: 14px 16px; }
.statcard .num { font: 750 28px/1.15 var(--mono); letter-spacing: -.01em; }
.statcard .lbl { color: var(--muted); font-size: 13.5px; margin-top: 2px; }
.statcard.warn .num { color: var(--red); }
.statcard.brand .num { color: var(--brand-ink); }
.statcard.mint .num { color: var(--mint-text); }

/* ---------- pills / chips / badges ---------- */
.pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 12.5px;
  font-weight: 650;
  border-radius: 999px;
  padding: 3px 9px;
  white-space: nowrap;
}
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.s-pending { background: var(--surface-2); color: var(--muted); }
.pill.s-in_progress { background: var(--brand-soft); color: var(--brand-ink); }
.pill.s-review { background: var(--amber-soft); color: #9A6A0B; }
.pill.s-done { background: var(--mint-soft); color: var(--mint-text); }
.pill.s-overdue { background: var(--red-soft); color: var(--red); }
.tag {
  display: inline-block;
  font-size: 12px;
  font-weight: 600;
  border-radius: 6px;
  padding: 2.5px 7px;
  background: var(--surface-2);
  color: var(--muted);
  white-space: nowrap;
}
.tag.b { background: var(--brand-soft); color: var(--brand-ink); }
.tag.k { background: var(--sky-soft); color: var(--sky-text); }
.tag.m { background: var(--mint-soft); color: var(--mint-text); }
.tag.r { background: var(--red-soft); color: var(--red); }
.tag.a { background: var(--amber-soft); color: #9A6A0B; }
.avatar {
  display: inline-grid;
  place-items: center;
  width: 22px;
  height: 22px;
  border-radius: 7px;
  background: var(--brand-soft);
  color: var(--brand-ink);
  font-size: 12px;
  font-weight: 750;
  vertical-align: -5px;
  margin-right: 5px;
}
.who { display: inline-flex; align-items: center; font-size: 13.5px; color: var(--ink); font-weight: 550; margin-right: 10px; }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border-radius: 9px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  font-size: 13.5px;
  font-weight: 600;
  padding: 6px 12px;
}
.btn:hover { border-color: var(--brand); color: var(--brand-ink); }
.btn.pri { background: var(--brand); border-color: var(--brand); color: #fff; }
.btn.pri:hover { background: var(--brand-ink); color: #fff; }
.btn.mint { background: var(--mint-soft); border-color: var(--mint); color: var(--mint-text); }
.btn.danger { background: var(--red-soft); border-color: transparent; color: var(--red); }
.btn.ghost { background: transparent; }
.btn.sm { padding: 3.5px 9px; font-size: 13px; border-radius: 7px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; pointer-events: none; }
.btnrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

/* ---------- tables ---------- */
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 11px; background: var(--surface); }
table.tbl { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 700px; }
.tbl th {
  text-align: left;
  font-size: 12.5px;
  font-weight: 650;
  letter-spacing: .04em;
  color: var(--muted);
  background: var(--surface-2);
  padding: 8px 12px;
  white-space: nowrap;
}
.tbl td { padding: 9px 12px; border-top: 1px solid var(--line); vertical-align: top; }
.tbl tr:hover td { background: #F8FBF9; }
.tbl .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.tbl input, .tbl select { max-width: 160px; }

/* ---------- forms ---------- */
input.ipt, select.ipt, textarea.ipt {
  width: 100%;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 6px 9px;
  font-size: 14px;
  background: #fff;
}
textarea.ipt { resize: vertical; min-height: 60px; }
input.ipt:focus, textarea.ipt:focus, select.ipt:focus { border-color: var(--brand); outline: none; }
/* 特异性须压过 input.ipt / select.ipt 的 width:100% */
input.ipt-inline, select.ipt-inline, textarea.ipt-inline { width: auto; }
.filterbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 13px; }
.filterbar .ipt { width: auto; min-width: 130px; }
.filterbar .search { min-width: 200px; }

/* ---------- project card ---------- */
.proj-card { cursor: pointer; transition: border-color .15s ease; }
.proj-card:hover { border-color: var(--brand); }
.proj-card .top { display: flex; align-items: baseline; gap: 10px; }
.proj-card .name { font-size: 16.5px; font-weight: 750; }
.proj-card .meta { color: var(--muted); font-size: 13.5px; margin: 6px 0 10px; display: flex; flex-wrap: wrap; gap: 4px 14px; }
.mini-flow { display: flex; gap: 3px; }
.mini-flow i {
  height: 8px;
  flex: 1;
  border-radius: 3px;
}
/* 通用进度段配色（.mini-flow i 与 .seg 共用）——各状态类特异性保持一致，
   故容器不设默认 background，未开始由 .f-pending 显式着色 */
.f-pending { background: var(--line); }
.f-done { background: var(--mint); }
.f-in_progress { background: var(--brand); }
.f-review { background: var(--amber); }
.f-overdue { background: var(--red); }

/* ---------- home: 统计卡筛选 / 风险条 / 项目行 ---------- */
.statcard.click { cursor: pointer; transition: border-color .15s ease; }
.statcard.click:hover { border-color: var(--brand); }
.statcard.on { border-color: var(--brand); box-shadow: 0 0 0 1px var(--brand), var(--shadow); }
.statcard .hint { font-size: 12px; color: var(--muted); margin-top: 4px; }
.riskbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px 12px;
  background: var(--red-soft);
  color: var(--red);
  border-radius: 11px;
  padding: 11px 15px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
}
.riskbar .go { margin-left: auto; font-size: 13.5px; font-weight: 650; }
.riskbar .cool { color: #8A3B3E; font-weight: 500; }
.prow { cursor: pointer; transition: border-color .15s ease; }
.prow:hover { border-color: var(--brand); }
.prow-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px; }
.prow-head .name { font-size: 17px; font-weight: 750; }
.prow-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 20px;
  color: var(--muted);
  font-size: 13.5px;
  margin: 9px 0 12px;
}
.prow-meta b { color: var(--ink); font-family: var(--mono); font-weight: 650; }
.prow-meta b.over { color: var(--red); }
.flowbar { display: flex; gap: 10px; align-items: flex-end; }
.flowbar .grp { display: flex; gap: 3px; }
.flowbar .grp.g-entry { flex: 1; }
.flowbar .grp.g-product { flex: 8; }
.flowbar .grp.g-order { flex: 6; }
.seg {
  position: relative;
  flex: 1;
  height: 10px;
  border-radius: 3px;
  cursor: pointer;
  transition: transform .12s ease;
}
.seg:hover { transform: scaleY(1.5); }
.seg.cur {
  height: 16px;
  box-shadow: 0 0 0 2px var(--surface), 0 0 0 3.5px var(--brand);
}
.flow-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 8px;
  align-items: center;
  margin-top: 11px;
  font-size: 13.5px;
  color: var(--muted);
}
.flow-legend b { color: var(--ink); }
.phase-ticks {
  display: flex;
  gap: 10px;
  margin-top: 5px;
  font: 550 10.5px/1 var(--mono);
  letter-spacing: .1em;
  color: var(--muted);
  text-transform: uppercase;
}
.phase-ticks span.g-entry { flex: 1; }
.phase-ticks span.g-product { flex: 8; }
.phase-ticks span.g-order { flex: 6; }
.todo-head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 4px; }
.todo-head .tabs { margin: 0 0 0 auto; border: 0; }
.todo-head .tabs button { padding: 5px 11px; font-size: 13.5px; }

/* ---------- todo list ---------- */
.todo-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 4px;
  border-top: 1px dashed var(--line-dash);
  cursor: pointer;
  font-size: 14px;
}
.todo-item:first-of-type { border-top: 0; }
.todo-item:hover .t-name { color: var(--brand-ink); }
.todo-item .t-name { font-weight: 600; }
.todo-item .t-proj { color: var(--muted); font-size: 13px; }
.todo-item .t-dl { margin-left: auto; font-family: var(--mono); font-size: 13px; color: var(--muted); white-space: nowrap; }
.todo-item .t-dl.over { color: var(--red); font-weight: 700; }

/* ---------- workflow lanes ---------- */
.lanes { display: grid; gap: 0; }
.lane { padding: 12px 0; }
.lane + .lane { border-top: 1px dashed var(--line-dash); }
.lane-tag { display: flex; align-items: center; gap: 7px; font-size: 13.5px; font-weight: 700; margin-bottom: 9px; }
.lane-tag i { width: 10px; height: 10px; border-radius: 2.5px; }
.lane-tag span { font: 550 11px/1 var(--mono); letter-spacing: .1em; color: var(--muted); text-transform: uppercase; }
.lane.ph-dev .lane-tag i { background: var(--brand); }
.lane.ph-pre .lane-tag i { background: var(--sky); }
.lane.ph-end .lane-tag i { background: var(--mint); }
.lane-chips { display: flex; flex-wrap: wrap; gap: 8px 6px; align-items: stretch; }
.nchip {
  display: flex;
  flex-direction: column;
  gap: 3px;
  min-width: 118px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--surface-2);
  padding: 7px 10px;
  cursor: pointer;
  transition: border-color .15s ease;
}
.nchip:hover { border-color: var(--brand); }
.nchip.cur { border-color: var(--brand); box-shadow: 0 0 0 1px var(--brand); background: var(--brand-soft); }
.nchip.disabled { cursor: default; }
.nchip.disabled:hover { border-color: var(--line); }
.nchip .l1 { display: flex; align-items: center; gap: 6px; font-size: 13.5px; font-weight: 700; }
.nchip .no {
  display: inline-grid;
  place-items: center;
  width: 19px;
  height: 19px;
  border-radius: 5px;
  color: #fff;
  font: 700 11px/1 var(--mono);
}
.ph-dev .nchip .no { background: var(--brand); }
.ph-pre .nchip .no { background: var(--sky); color: #0C5C4A; }
.ph-end .nchip .no { background: var(--mint); color: #06331F; }
.nchip .l2 { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--muted); font-family: var(--mono); }
.dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
.dot.s-pending { background: var(--line-dash); }
.dot.s-in_progress { background: var(--brand); }
.dot.s-review { background: var(--amber); }
.dot.s-done { background: var(--mint); }
.nchip .over { color: var(--red); font-weight: 700; }
.hintbar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 14px;
  align-items: center;
  background: var(--brand-soft);
  border-radius: 10px;
  padding: 10px 14px;
  font-size: 14px;
  margin-top: 13px;
}
.hintbar b { color: var(--brand-ink); }
.hintbar.warn { background: var(--red-soft); }
.hintbar.warn b { color: var(--red); }

/* ---------- node detail ---------- */
.kv { font-size: 13.5px; color: var(--muted); }
.kv b { color: var(--ink); font-family: var(--mono); font-weight: 650; }
.kv b.over { color: var(--red); }
.sec-title {
  font-size: 12.5px;
  font-weight: 700;
  letter-spacing: .08em;
  color: var(--muted);
  text-transform: uppercase;
  margin: 0 0 8px;
  font-family: var(--mono);
}
.file-item {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13.5px;
  padding: 6px 9px;
  border: 1px dashed var(--line-dash);
  border-radius: 8px;
  color: var(--muted);
  margin-bottom: 6px;
}
.chk { display: flex; align-items: flex-start; gap: 8px; padding: 5px 0; font-size: 14px; cursor: pointer; }
.chk input { margin-top: 3px; accent-color: var(--brand); }
.chk.done span { color: var(--muted); text-decoration: line-through; }
.cmt { border-top: 1px dashed var(--line-dash); padding: 9px 0; font-size: 14px; }
.cmt:first-of-type { border-top: 0; }
.cmt .h { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
.cmt .t { color: var(--muted); font-size: 12px; font-family: var(--mono); margin-left: auto; }
.cmt p { margin: 0; color: #3F5D54; }
.ver { display: flex; gap: 10px; align-items: baseline; padding: 7px 0; border-top: 1px dashed var(--line-dash); font-size: 13.5px; }
.ver:first-of-type { border-top: 0; }
.ver .v { font: 700 12px/1.6 var(--mono); color: var(--brand-ink); min-width: 42px; }
.ver .d { color: var(--muted); font-family: var(--mono); font-size: 12px; margin-left: auto; white-space: nowrap; }
.reject-box { margin-top: 8px; }

/* ---------- psf ---------- */
.psf-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 13px; }
.lang-toggle { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
.lang-toggle button { border: 0; background: var(--surface); padding: 5px 13px; font-size: 13.5px; font-weight: 650; color: var(--muted); }
.lang-toggle button.on { background: var(--brand); color: #fff; }
.psf-sec { margin-top: 14px; }
.psf-sec .tbl td input.cell {
  width: 100%;
  border: 1px solid transparent;
  background: transparent;
  border-radius: 6px;
  padding: 3px 6px;
  font-size: 14px;
}
.psf-sec .tbl td input.cell:hover { border-color: var(--line); background: #fff; }
.psf-sec .tbl td input.cell:focus { border-color: var(--brand); background: #fff; outline: none; }
.psf-sec .tbl td input.cell[disabled] { color: var(--ink); opacity: 1; }
tr.critical td { background: var(--red-soft) !important; }
tr.critical td:first-child { border-left: 3px solid var(--red); }
.badge-final {
  background: var(--mint);
  color: #06331F;
  font: 750 11.5px/1 var(--mono);
  letter-spacing: .08em;
  border-radius: 999px;
  padding: 5px 10px;
}
.badge-lock { background: var(--surface-2); color: var(--muted); font-size: 12.5px; border-radius: 999px; padding: 4px 10px; font-weight: 650; }

/* ---------- side panel ---------- */
.panel-mask { position: fixed; inset: 0; background: rgba(9,20,45,.35); z-index: 60; }
.panel {
  position: fixed;
  top: 0; right: 0; bottom: 0;
  width: min(460px, 94vw);
  background: var(--surface);
  z-index: 61;
  box-shadow: -12px 0 40px rgba(9,20,45,.18);
  display: flex;
  flex-direction: column;
}
.panel .p-head { padding: 14px 18px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
.panel .p-head h3 { margin: 0; font-size: 15px; }
.panel .p-body { padding: 14px 18px; overflow-y: auto; flex: 1; }
.panel .p-foot { padding: 12px 18px; border-top: 1px solid var(--line); display: flex; gap: 8px; justify-content: flex-end; }
.x { margin-left: auto; border: 0; background: var(--surface-2); border-radius: 8px; width: 28px; height: 28px; font-size: 15px; color: var(--muted); }
.sup-row { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 9px; display: flex; gap: 10px; align-items: flex-start; }
.sup-row.on { border-color: var(--brand); background: var(--brand-soft); }
.sup-row input { margin-top: 3px; accent-color: var(--brand); }
.sup-row .s-name { font-weight: 700; font-size: 14.5px; }
.sup-row .s-meta { color: var(--muted); font-size: 13px; margin-top: 2px; display: flex; flex-wrap: wrap; gap: 3px 10px; }

/* ---------- overlay / sheet ---------- */
.ovl { position: fixed; inset: 0; background: rgba(9,20,45,.45); z-index: 70; overflow-y: auto; padding: 30px 16px; }
.sheet {
  background: #fff;
  max-width: 880px;
  margin: 0 auto;
  border-radius: 14px;
  padding: 28px 32px;
  box-shadow: 0 24px 70px rgba(9,20,45,.3);
  color: #17362D;
}
.sheet-head { display: flex; align-items: center; gap: 12px; border-bottom: 2px solid #0B8F43; padding-bottom: 12px; margin-bottom: 16px; }
.sheet-head h2 { margin: 0; font-size: 19px; }
.sheet-head .mk { display: flex; gap: 5px; }
.sheet-head .mk i { width: 12px; height: 12px; border-radius: 3px; display: block; }
.sheet-head .mk i:first-child { background: #27A98B; }
.sheet-head .mk i:last-child { background: #54C98A; }
.sheet-sub { color: #60766F; font-size: 13px; margin: -10px 0 14px; }
.ovl-actions { max-width: 880px; margin: 0 auto 12px; display: flex; justify-content: flex-end; gap: 8px; }
.ovl-actions .btn { background: #fff; }
.slide { border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 8px; align-items: center; text-align: center; }
.slide .ph { font-size: 44px; background: var(--surface-2); border-radius: 10px; width: 100%; padding: 22px 0; }
.slide .a { font: 700 13px/1.4 var(--mono); color: var(--brand-ink); }
.slide .p { font-size: 13.5px; color: var(--muted); }
.spin {
  width: 26px; height: 26px;
  border: 3px solid var(--brand-soft);
  border-top-color: var(--brand);
  border-radius: 50%;
  animation: sp 0.8s linear infinite;
  margin: 20px auto;
}
@keyframes sp { to { transform: rotate(360deg); } }
.raw {
  background: #17362D;
  color: #D6EADF;
  font: 12px/1.7 var(--mono);
  border-radius: 10px;
  padding: 14px 16px;
  white-space: pre-wrap;
  max-height: 220px;
  overflow-y: auto;
}

/* ---------- matrix (dashboard) ---------- */
.matrix-wrap { overflow-x: auto; }
.matrix { border-collapse: collapse; font-size: 13px; min-width: 760px; width: 100%; }
.matrix th { font: 650 11px/1.3 var(--mono); color: var(--muted); padding: 5px 3px; text-align: center; }
.matrix td { padding: 4px 3px; }
.matrix td.pname { font-weight: 700; font-size: 14px; white-space: nowrap; padding-right: 12px; }
.mcell {
  height: 26px;
  border-radius: 6px;
  background: var(--surface-2);
  display: grid;
  place-items: center;
  font: 650 10.5px/1 var(--mono);
  color: transparent;
  cursor: pointer;
}
.mcell.s-done { background: var(--mint); color: #06331F; }
.mcell.s-in_progress { background: var(--brand); color: #fff; }
.mcell.s-review { background: var(--amber); color: #5B3E06; }
.mcell.ov { box-shadow: inset 0 0 0 2px var(--red); }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; color: var(--muted); margin-top: 10px; }
.legend i { width: 12px; height: 12px; border-radius: 4px; display: inline-block; vertical-align: -2px; margin-right: 5px; }

/* ---------- tabs ---------- */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 14px; }
.tabs button {
  border: 0;
  background: transparent;
  padding: 8px 14px;
  font-size: 14.5px;
  font-weight: 650;
  color: var(--muted);
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
}
.tabs button.on { color: var(--brand-ink); border-bottom-color: var(--brand); }

/* ---------- clients ---------- */
.swatches { display: flex; gap: 6px; }
.swatches i { width: 26px; height: 26px; border-radius: 7px; border: 1px solid var(--line); }
.prod-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.prod {
  border: 1px solid var(--line);
  border-radius: 11px;
  background: var(--surface);
  padding: 12px;
  cursor: pointer;
  transition: border-color .15s ease;
}
.prod:hover { border-color: var(--brand); }
.prod .ph { font-size: 36px; text-align: center; background: var(--surface-2); border-radius: 9px; padding: 14px 0; margin-bottom: 8px; }
.prod .a { font: 700 12px/1.5 var(--mono); color: var(--brand-ink); }
.prod .n { font-weight: 650; font-size: 14px; }
.prod .m { color: var(--muted); font-size: 12.5px; }

/* ---------- client (HEMA) view ---------- */
.confirm-card { border: 1px solid var(--amber); background: var(--amber-soft); border-radius: 12px; padding: 14px 16px; }
.confirm-card h4 { margin: 0 0 6px; font-size: 15px; }
.confirm-card p { margin: 0 0 10px; font-size: 13.5px; color: #6B4E0E; }
.client-banner {
  background: var(--sky-soft);
  color: var(--sky-text);
  border-radius: 10px;
  padding: 9px 14px;
  font-size: 13.5px;
  font-weight: 600;
  margin-bottom: 14px;
}

/* ---------- toast ---------- */
#toast-root { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 90; display: grid; gap: 8px; }
.toast {
  background: #17362D;
  color: #fff;
  border-radius: 10px;
  padding: 10px 18px;
  font-size: 14px;
  box-shadow: 0 12px 30px rgba(9,20,45,.35);
  animation: tin .2s ease;
}
.toast.ok { background: #147A47; }
@keyframes tin { from { opacity: 0; transform: translateY(8px); } }

.empty { color: var(--muted); font-size: 14px; padding: 18px 0; text-align: center; }
.note-strip { background: var(--surface-2); border-radius: 9px; padding: 8px 12px; font-size: 13px; color: var(--muted); }

/* ---------- 文件上传 / 照片墙 / 档案编辑 ---------- */
.file-item .del {
  margin-left: 6px;
  border: 0;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  font-size: 13px;
  padding: 2px 4px;
}
.file-item .del:hover { color: var(--red); }
.file-item .fmeta { margin-left: auto; font: 500 12px/1.4 var(--mono); color: var(--muted); white-space: nowrap; }
.prod .ph.img { padding: 0; overflow: hidden; height: 88px; }
.prod .ph.img img { width: 100%; height: 100%; object-fit: cover; display: block; }
.tag .tx { margin-left: 5px; cursor: pointer; opacity: .65; }
.tag .tx:hover { opacity: 1; }
.add-row { display: flex; gap: 6px; margin-top: 9px; align-items: center; }
.add-row .ipt { max-width: 200px; }

/* ---------- 业务环节 SOP ---------- */
.sop-item { border-top: 1px dashed var(--line-dash); padding: 11px 2px; }
.sop-item:first-of-type { border-top: 0; }
.sop-head { display: flex; flex-wrap: wrap; align-items: center; gap: 7px 10px; cursor: pointer; }
.sop-head:hover .sop-name { color: var(--brand-ink); }
.sop-name { font-weight: 650; font-size: 14px; }
.sop-when {
  font-size: 12.5px;
  color: var(--sky-text);
  background: var(--sky-soft);
  border-radius: 6px;
  padding: 3px 8px;
}
.sop-toggle { margin-left: auto; font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.sop-body { margin-top: 9px; padding-left: 2px; }
.sop-note {
  position: relative;
  padding-left: 17px;
  font-size: 13.5px;
  line-height: 1.7;
  color: #3F5D54;
  margin: 5px 0;
}
.sop-note::before {
  content: "";
  position: absolute;
  left: 3px;
  top: 9px;
  width: 6px;
  height: 6px;
  border-radius: 2px;
  background: var(--brand);
  opacity: .6;
}
.sop-note.warn { color: #9A3B3E; }
.sop-note.warn::before { background: var(--red); opacity: 1; }
.sop-path {
  display: flex;
  align-items: center;
  gap: 7px;
  margin-top: 7px;
  background: var(--surface-2);
  border-radius: 7px;
  padding: 6px 10px;
  font: 500 11.5px/1.5 var(--mono);
  color: var(--muted);
  word-break: break-all;
}
.sop-path b { color: var(--ink); font-weight: 650; flex: 0 0 auto; }
.sop-path button { margin-left: auto; flex: 0 0 auto; }
.sop-card { border-left: 3px solid var(--brand); }
.sop-card.ph-pre { border-left-color: var(--sky); }
.sop-card.ph-end { border-left-color: var(--mint); }

/* ---------- 表单行 / 选择芯片 ---------- */
.form-row { display: grid; grid-template-columns: 92px 1fr; gap: 8px; align-items: center; margin-bottom: 9px; font-size: 14px; }
.form-row > label { color: var(--muted); font-size: 13.5px; }
.chip-select { display: flex; flex-wrap: wrap; gap: 6px; }
label.pick {
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 4px 9px;
  font-size: 13px;
  cursor: pointer;
  color: var(--muted);
}
label.pick input { margin-right: 4px; accent-color: var(--brand); }
label.pick.on { border-color: var(--brand); background: var(--brand-soft); color: var(--brand-ink); }
.sku-row { display: grid; grid-template-columns: 104px 1fr 140px 96px 30px; gap: 7px; align-items: center; margin-bottom: 7px; }
.sku-row .art { font: 650 12px/1.4 var(--mono); color: var(--brand-ink); }

/* ---------- 客户档案 ---------- */
.kfacts { display: grid; grid-template-columns: 1fr 1fr; gap: 7px 14px; font-size: 13.5px; margin-top: 10px; }
.kfacts span { color: var(--muted); }
.kfacts b { color: var(--ink); font-weight: 650; margin-left: 5px; }
.color-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.color-item { display: flex; gap: 9px; align-items: center; border: 1px solid var(--line); border-radius: 9px; padding: 7px 9px; }
.color-item i { width: 30px; height: 30px; border-radius: 7px; border: 1px solid var(--line); flex: 0 0 30px; }
.color-item .cn { font-weight: 650; font-size: 13.5px; }
.color-item .cu { color: var(--muted); font-size: 12px; }
.risk-note { position: relative; padding-left: 16px; font-size: 14px; color: var(--muted); margin: 8px 0; line-height: 1.65; }
.risk-note::before { content: ""; position: absolute; left: 2px; top: 8px; width: 6px; height: 6px; border-radius: 50%; background: var(--red); }

/* ---------- 全局搜索 / 提醒铃铛 ---------- */
.searchbox { position: relative; }
.searchbox input {
  width: 240px;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 5.5px 10px;
  font-size: 13.5px;
  background: #fff;
}
.searchbox input:focus { border-color: var(--brand); outline: none; }
.search-drop {
  position: absolute;
  top: calc(100% + 6px);
  right: 0;
  width: 320px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 11px;
  box-shadow: 0 16px 40px rgba(9,20,45,.16);
  z-index: 55;
  overflow: hidden;
}
.search-item { display: flex; gap: 8px; align-items: center; padding: 8.5px 12px; font-size: 13.5px; cursor: pointer; }
.search-item + .search-item { border-top: 1px solid var(--surface-2); }
.search-item:hover { background: var(--surface-2); }
.search-item .k {
  font: 650 11px/1 var(--mono);
  letter-spacing: .06em;
  color: var(--brand-ink);
  background: var(--brand-soft);
  border-radius: 5px;
  padding: 3px 5px;
  flex: 0 0 auto;
}
.search-item .sub { margin-left: auto; color: var(--muted); font-size: 12px; white-space: nowrap; }
.bell {
  position: relative;
  border: 1px solid var(--line);
  background: #fff;
  border-radius: 8px;
  width: 30px;
  height: 30px;
  display: grid;
  place-items: center;
  font-size: 15px;
}
.bell:hover { border-color: var(--brand); }
.bell b {
  position: absolute;
  top: -6px;
  right: -7px;
  background: var(--red);
  color: #fff;
  font: 700 10.5px/1 var(--mono);
  border-radius: 999px;
  padding: 3px 5px;
}

/* ---------- 节点标题区 ---------- */
.node-title { margin-bottom: 16px; }
.node-title .t-row { display: flex; flex-wrap: wrap; align-items: center; gap: 9px 12px; }
.node-title .t-no {
  display: inline-grid;
  place-items: center;
  width: 34px;
  height: 34px;
  border-radius: 10px;
  background: var(--brand);
  color: #fff;
  font: 750 15px/1 var(--mono);
  font-variant-numeric: tabular-nums;
}
.node-title.ph-pre .t-no { background: var(--sky); color: #0C5C4A; }
.node-title.ph-end .t-no { background: var(--mint); color: #06331F; }
.node-title h1 { margin: 0; font-size: 24px; font-weight: 750; letter-spacing: .01em; }
.node-title .t-code {
  font: 700 13px/1 var(--mono);
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--brand-ink);
  background: var(--brand-soft);
  border-radius: 6px;
  padding: 5px 8px;
}
.node-title .t-acts { margin-left: auto; display: flex; flex-wrap: wrap; gap: 8px; }
.node-title .t-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 5px 20px;
  align-items: center;
  border-top: 1px solid var(--line);
  margin-top: 12px;
  padding-top: 10px;
  font-size: 13.5px;
  color: var(--muted);
}
.node-title .t-meta b { color: var(--ink); font-family: var(--mono); font-weight: 650; }
.node-title .t-meta b.over { color: var(--red); }

/* ---------- 流程节点卡（带编号格） ---------- */
.nflow-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 12px; }
.nflow-head h3 { margin: 0; font-size: 15.5px; font-weight: 700; }
.nflow-head .navs { margin-left: auto; display: flex; gap: 6px; }
.nflow { display: flex; gap: 16px; flex-wrap: wrap; }
.nflow-grp { display: flex; flex-direction: column; gap: 6px; }
.nflow-cells { display: flex; gap: 4px; }
.nflow-grp .lbl {
  font: 550 11px/1 var(--mono);
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--muted);
}
.ncell {
  min-width: 36px;
  height: 30px;
  border-radius: 8px;
  display: grid;
  place-items: center;
  font: 700 12.5px/1 var(--mono);
  font-variant-numeric: tabular-nums;
  cursor: pointer;
  border: 1px solid transparent;
  color: var(--muted);
  background: var(--surface-2);
  transition: transform .12s ease, border-color .12s ease;
  white-space: nowrap;
  padding: 0 8px;
}
.ncell:hover { transform: translateY(-2px); border-color: var(--brand); }
.ncell.f-done { background: var(--mint); color: #06331F; }
.ncell.f-in_progress { background: var(--brand); color: #fff; }
.ncell.f-review { background: var(--amber); color: #5B3E06; }
.ncell.f-overdue { background: var(--red); color: #fff; }
.ncell.cur { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--brand); font-weight: 750; }
.ncell.cur .cname { margin-left: 6px; font-family: inherit; font-size: 12.5px; }

/* ---------- SYLOON 品牌与四中心首页 ---------- */
.side-brand { padding-top: 2px; color: #fff; text-decoration: none; }
.side-brand:hover { color: #fff; text-decoration: none; }
.syloon-logo {
  display: inline-flex;
  align-items: center;
  width: 136px;
  min-width: 0;
}
.syloon-logo img { display: block; width: 100%; height: auto; }
.syloon-logo.hero { width: 292px; }
.side-brand .logo-tag { display: none; }

.workflow-switcher {
  position: sticky;
  top: 50px;
  z-index: 24;
  background: rgba(255,255,255,.97);
  border-bottom: 1px solid var(--line);
  box-shadow: 0 8px 22px -20px rgba(0,76,63,.55);
  padding: 9px 24px 10px;
}
.workflow-switch-head { display: flex; align-items: center; gap: 10px; margin-bottom: 7px; }
.workflow-switch-head strong { font-size: 13px; color: var(--brand-deep); }
.workflow-switch-head select {
  min-width: 155px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  border-radius: 8px;
  padding: 4px 26px 4px 8px;
  font-size: 12.5px;
}
.workflow-switch-head .hint { margin-left: auto; color: var(--muted); font-size: 12px; }
.workflow-groups { display: flex; align-items: stretch; gap: 8px; min-width: max-content; }
.workflow-scroll { overflow-x: auto; padding: 1px 0 3px; }
.workflow-group {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 4px;
  border-radius: 10px;
  background: var(--surface-2);
}
.workflow-group .group-label {
  padding: 0 7px;
  font-size: 11px;
  font-weight: 750;
  line-height: 1.25;
  color: var(--muted);
  white-space: nowrap;
}
.workflow-group.dev { background: #E4F2EC; }
.workflow-group.dev .group-label { color: var(--brand-deep); }
.workflow-group.order { background: #E7F5EA; }
.workflow-group.order .group-label { color: var(--brand-ink); }
.workflow-step {
  display: grid;
  grid-template-columns: auto 1fr;
  align-items: center;
  gap: 5px;
  min-width: 78px;
  height: 34px;
  padding: 0 8px;
  border: 1px solid transparent;
  border-radius: 8px;
  background: #fff;
  color: var(--muted);
  white-space: nowrap;
  transition: border-color .15s ease, transform .15s ease, box-shadow .15s ease;
}
.workflow-step:hover { border-color: var(--brand); transform: translateY(-1px); text-decoration: none; }
.workflow-step .no { font: 750 11px/1 var(--mono); color: var(--brand-ink); }
.workflow-step .nm { font-size: 11.5px; font-weight: 650; }
.workflow-step.done { background: #F4FAF6; }
.workflow-step.progress { border-color: var(--brand); box-shadow: inset 0 0 0 1px var(--brand); }
.workflow-step.review { border-color: var(--amber); }
.workflow-step.overdue { border-color: var(--red); background: var(--red-soft); }
.workflow-step.current { background: var(--brand-deep); color: #fff; border-color: var(--brand-deep); box-shadow: 0 5px 12px rgba(0,76,63,.2); }
.workflow-step.current .no { color: #8CE4AF; }

.landing-shell { min-height: 100vh; background: #fff; }
.landing-view { width: min(1200px, calc(100vw - 48px)); margin: 0 auto; padding: 40px 0 62px; }
.platform-home { position: relative; }
.platform-hero { height: 64px; display: flex; justify-content: center; align-items: flex-start; }
.home-mosaic {
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  grid-template-rows: 360px 205px;
  grid-template-areas:
    "product product product order order order"
    "supplier supplier standard standard data data";
  gap: 16px;
  margin-top: 56px;
}
.home-tile {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-width: 0;
  border-radius: 8px;
  color: #013F31;
  text-decoration: none;
  overflow: hidden;
  transition: transform .16s ease, filter .16s ease;
}
a.home-tile:hover { transform: translateY(-2px); filter: brightness(1.025); text-decoration: none; }
.home-mosaic .module-card { min-height: 0; padding: 24px; border: 0; box-shadow: none; }
.home-mosaic .module-card::after { display: none; }
.home-tile.product { grid-area: product; background: #013F31; color: #fff; }
.home-tile.supplier { grid-area: supplier; background: #0F8535; color: #fff; }
.home-tile.order { grid-area: order; background: linear-gradient(135deg, #013F31 0%, #0F8535 100%); color: #00EC68; }

  chain.forEach(id => {

    cursor = addDays(cursor, -def.dur);

let db;
function loadDB() {
  try {
    const raw = localStorage.getItem(DB_KEY);
    if (raw) { db = JSON.parse(raw); return; }
  } catch (e) { /* ignore */ }
  db = seed();
  saveDB();
}
function saveDB() {
  try { localStorage.setItem(DB_KEY, JSON.stringify(db)); } catch (e) { /* ignore */ }
}
function resetDemo() {
  try { localStorage.removeItem(DB_KEY); } catch (e) { /* ignore */ }
  db = seed(); upgradeV7(); saveDB();
  ui.overlay = null; ui.panel = null;
  location.hash = '#/home';
  render();
  toast('演示数据已重置', true);
}

function workflowSwitcher(parts) {
  const active = db.projects.filter(p => p.status === 'active');
  if (!active.length || isClient()) return '';
  const routeProject = parts[0] === 'projects' && parts[1] ? proj(parts[1]) : null;
  const p = routeProject || proj(ui.flowProjectId) || active[0];
  ui.flowProjectId = p.id;
  const currentId = parts[0] === 'projects' && parts[2] === 'node' ? parts[3] : '';
  const stepLink = n => {
    const def = nodeDef(n.id);
    const cls = isOverdue(n) ? 'overdue' : n.status === 'done' ? 'done' : n.status === 'in_progress' ? 'progress' : n.status === 'review' ? 'review' : '';
    return `<a class="workflow-step ${cls} ${currentId === n.id ? 'current' : ''}" href="#/projects/${p.id}/node/${n.id}"
      title="${n.id} ${def.name} · ${STATUS_LABEL[n.status]}${isOverdue(n) ? ' · 已逾期' : ''}">
      <span class="no">${n.id}</span><span class="nm">${def.name}</span></a>`;
  };
  const group = (cls, label, nodes) => `<div class="workflow-group ${cls}"><span class="group-label">${label}</span>${nodes.map(stepLink).join('')}</div>`;
  return `<section class="workflow-switcher" aria-label="项目步骤快速切换">

      <strong>项目步骤 · 快速切换</strong>

    </div></div>
  </section>`;
}

  return `<div class="lanes">` + Object.keys(groups).map(ph => `

      <div class="lane-chips">

/* ---------- 节点详情 ---------- */
function nextStepBar(p, n) {
  const lastC = n.comments[n.comments.length - 1];
  if (n.status === 'in_progress' && lastC && lastC.text.startsWith('【驳回】')) {
    return `<div class="hintbar warn mt"><b>已被驳回</b><span>${esc(lastC.text.slice(4))}</span><span>—— 修改后重新提交审批</span></div>`;
  }
  if (n.status === 'pending') return `<div class="hintbar mt"><b>下一步</b>本节点尚未开始——点击右上角「开始节点」。</div>`;
  if (n.status === 'in_progress') {
    const tds = n.todos.filter(t => !t.done).length;
    const ms = p.skus.length - doneCount(p, n);
    return `<div class="hintbar mt"><b>下一步</b>${(tds || ms)
      ? `还差 ${tds} 项待办、${ms} 个 SKU 未完成——完成后点「提交审批」。`
      : '待办与 SKU 已全部完成——可以提交审批了。'}</div>`;
  }
  if (n.status === 'review') return `<div class="hintbar mt"><b>等待中</b>等待 ${esc(person(n.reviewerId || n.ownerId).name)} 审批 / 确认，业务侧无需操作。</div>`;
  return '';
}

/* ---------- 业务环节 SOP 渲染 ---------- */
const WARN_RE = /不接受|需向客人说明|要和客人说明|注意|提前一周|排不上|立马|及时|催|必须|要考虑/;
function sopNotes(s) {
  return s.notes.map(t => `<div class="sop-note ${WARN_RE.test(t) ? 'warn' : ''}">${esc(t)}</div>`).join('')
    + '<div class="sop-path"><b>参考资料</b><span>本环节有对应的 SOP 文件与项目归档资料，按内部规范存取</span></div>';
}
function nodeSopCard(n) {
  const list = sopOf(n.id);
  if (!list.length) return '';
  return `<div class="card mt sop-card ph-${nodeDef(n.id).phase}">
    <h3>业务环节 SOP <span class="tag">${list.length} 个环节 · HEMA 流程规范</span>
      <span style="flex:1"></span>
      <a href="#/clients/sop" style="font-size:13px">查看完整手册 →</a></h3>
    ${list.map((s, i) => {
      const key = n.id + '-' + i;
      const open = ui.sopOpen === key;
      const has = s.notes.length > 0;
      return `<div class="sop-item">
        <div class="sop-head" ${has ? `data-act="sop-toggle" data-k="${key}"` : ''}>
          <span class="sop-name">${esc(s.name)}</span>
          ${s.when ? `<span class="sop-when">⏱ ${esc(s.when)}</span>` : ''}
          ${has ? `<span class="sop-toggle">${open ? '收起 ▴' : (s.notes.length ? s.notes.length + ' 条注意事项 ' : '路径 ') + '▾'}</span>` : ''}
        </div>
        ${open ? `<div class="sop-body">${sopNotes(s)}</div>` : ''}
      </div>`;
    }).join('')}
  </div>`;
}

function nodeFlowCard(p, n) {
  const idx = p.nodes.findIndex(x => x.id === n.id);
  const prev = p.nodes[idx - 1], next = p.nodes[idx + 1];
  const groups = { dev: [], pre: [], end: [] };
  p.nodes.forEach(x => groups[nodeDef(x.id).phase].push(x));
  const LBL = { dev: '开发 01–07', pre: '产前 08–10', end: '尾期 11–15' };
  return `<div class="card">
    <div class="nflow-head">
      <h3>项目流程 <span class="tag">${NODE_DEFS.length} 节点 · 点击任一格跳转</span></h3>
      <span class="navs">
        <button class="btn sm" ${prev ? `data-act="goto" data-href="#/projects/${p.id}/node/${prev.id}"` : 'disabled'}>‹ ${prev ? prev.id + ' ' + nodeDef(prev.id).name : '已是首节点'}</button>
        <button class="btn sm" ${next ? `data-act="goto" data-href="#/projects/${p.id}/node/${next.id}"` : 'disabled'}>${next ? next.id + ' ' + nodeDef(next.id).name : '已是末节点'} ›</button>
      </span>
    </div>
    <div class="nflow">
      ${['dev', 'pre', 'end'].map(ph => `<div class="nflow-grp">
        <div class="nflow-cells">
          ${groups[ph].map(x => `<div class="ncell f-${isOverdue(x) ? 'overdue' : x.status} ${x.id === n.id ? 'cur' : ''}"
            title="${x.id} ${nodeDef(x.id).name} · ${STATUS_LABEL[x.status]}${isOverdue(x) ? ' · 已逾期' : ''}"
            data-act="goto" data-href="#/projects/${p.id}/node/${x.id}">${x.id}${x.id === n.id ? `<span class="cname">${nodeDef(x.id).name}</span>` : ''}</div>`).join('')}
        </div>
        <span class="lbl">${LBL[ph]}</span>
      </div>`).join('')}
    </div>
  </div>`;
}

function viewNode(p, n) {
  const def = nodeDef(n.id);
  const over = isOverdue(n);
  const dc = doneCount(p, n);
  const days = diffDays(TODAY, n.deadline);

  let actions = '';
  if (canEdit()) {
    if (n.status === 'pending') actions = `<button class="btn pri" data-act="n-start">开始节点</button>`;
    else if (n.status === 'in_progress') actions = `<button class="btn pri" data-act="n-submit">提交审批</button>`;
    else if (n.status === 'review') actions = `
      <button class="btn mint" data-act="n-approve">审批通过</button>
      <button class="btn danger" data-act="n-reject">驳回</button>`;
    else actions = `<span class="badge-final">节点已完成</span>`;
  }

  const step = p.nodes.findIndex(x => x.id === n.id) + 1;
  return `
  <div class="node-title ph-${def.phase}">
    <div class="t-row">
      <span class="t-no">${n.id}</span>
      <h1>${def.name}</h1>
      <span class="t-code">${def.code}</span>
      ${statusPill(n)}
      <span class="t-acts">${actions}</span>
    </div>
    <div class="crumb"><a href="#/projects">项目管理</a> / <a href="#/projects/${p.id}">${esc(p.name)}</a> / <b>${n.id} ${def.name}</b></div>

      <span class="tag ${def.phase === 'dev' ? 'b' : def.phase === 'pre' ? 'k' : 'm'}">${PHASES[def.phase].label}</span>

  </div>` : ''}
  ${ui.rejectOpen && n.status === 'review' ? `
  <div class="card mt reject-box">
    <h3>驳回原因（必填）</h3>
    <textarea class="ipt" id="rejectReason" placeholder="请说明驳回原因，将写入审批记录…"></textarea>
    <div class="btnrow mt"><button class="btn danger" data-act="n-reject-confirm">确认驳回</button>
    <button class="btn ghost" data-act="n-reject-cancel">取消</button></div>
  </div>` : ''}
  ${specificArea(p, n)}
  <div class="grid g3 mt">
    <div class="card"><h3>输入资料 / 附件
      <span style="flex:1"></span>
      ${canEdit() ? `<button class="btn sm" data-act="upload" data-kind="node" data-pid="${p.id}" data-nid="${n.id}">＋ 上传文件</button>` : ''}</h3>
      ${n.inputs.length ? n.inputs.map((f, i) => `<div class="file-item">${fileIcon(f.name)} ${esc(f.name)}
        ${f.seed ? '<span class="tag fmeta">占位</span>'
          : `<span class="fmeta">${f.size ? fmtSize(f.size) + ' · ' : ''}${esc(f.time || '')}${f.by ? ' · ' + esc(f.by) : ''}</span>
             ${canEdit() ? `<button class="del" data-act="input-del" data-i="${i}" title="删除">✕</button>` : ''}`}
      </div>`).join('') : '<div class="empty">暂无资料，点右上角上传</div>'}
    </div>
    <div class="card"><h3>待办清单 <span class="tag">${n.todos.filter(t => t.done).length}/${n.todos.length}</span></h3>
      ${n.todos.length ? n.todos.map((t, i) => `
        <label class="chk ${t.done ? 'done' : ''}"><input type="checkbox" ${t.done ? 'checked' : ''} ${canEdit() ? '' : 'disabled'} data-chg="todo" data-i="${i}"><span>${esc(t.t)}</span></label>`).join('') : '<div class="empty">暂无待办</div>'}

      ${n.versions.length ? n.versions.map(v => `<div class="ver"><span class="v">${esc(v.v)}</span><span>${esc(v.note)}</span><span class="d">${esc(v.time)} · ${esc(v.author)}</span></div>`).join('') : '<div class="empty">暂无版本记录</div>'}

  </div>
  <div class="card mt">
    <h3>SKU 完成度 <span class="tag b">已完成 ${dc} / 共 ${p.skus.length}</span>
      <span style="flex:1"></span>

    <div class="tbl-wrap"><table class="tbl">
      <thead><tr><th>货号</th><th>品名</th><th>品类</th><th>本节点状态</th></tr></thead>
      <tbody>${p.skus.map(s => `
        <tr><td class="num">${esc(s.artNo)}</td><td>${s.ph} ${esc(s.name)}</td><td><span class="tag">${CATS[s.cat]}</span></td>
        <td>${canEdit() ? `<button class="btn sm ${n.skuDone[s.id] ? 'mint' : ''}" data-act="sku-toggle" data-sku="${s.id}">
          ${n.skuDone[s.id] ? '✓ 已完成' : '未完成 · 点击标记'}</button>` : (n.skuDone[s.id] ? '✓ 已完成' : '未完成')}</td></tr>`).join('')}
      </tbody></table></div>
  </div>
  <div class="card mt">
    <h3>审批 / Comments</h3>
    ${n.comments.length ? n.comments.map(c => `
      <div class="cmt"><div class="h">${avatarOf(c.author)}<span class="tag">${esc(c.role)}</span><span class="t">${esc(c.time)}</span></div>
      <p>${esc(c.text)}</p></div>`).join('') : '<div class="empty">暂无记录</div>'}
    ${canEdit() ? `<div class="btnrow mt"><input class="ipt" id="cmtBox" placeholder="追加一条 comment…" style="flex:1">
      <button class="btn" data-act="add-comment">发送</button></div>` : ''}

}

/* ---------- 节点专属功能区 ---------- */
function specificArea(p, n) {
  if (n.id === '01') return areaBrief(p, n);
  if (n.id === '03') return areaPsfList(p);
  if (n.id === '05') return areaTender(p, n);
  if (n.id === '07') return areaFS(p, n);
  if (n.id === '08') return areaPackaging();
  if (n.id === '12' || n.id === '13') return areaInspect(p, n);
  if (n.id === '15') return areaCloseout(n);
  return '';
}

/* 08 包材：克重 / 材质规则速查表 */
function areaPackaging() {
  const s = SOP.find(x => x.name.indexOf('包材设计') >= 0);
  const rows = s.notes.filter(t => /^(彩盒|背卡|腰封|吊牌|卡头|展示盒|橡皮包纸|不干胶)/.test(t))
    .map(t => { const i = t.indexOf('：'); return [t.slice(0, i), t.slice(i + 1)]; });
  return `<div class="card mt">
    <h3>包材规格速查 <span class="tag">HEMA 硬性要求 · 出错即返工</span></h3>
    <div class="riskbar" style="cursor:default;margin-bottom:12px">⚠ 普遍不覆膜、不接受 PVC 材质
      <span class="cool">特殊情况必须向客人说明；确需覆膜时膜重 &lt; 整体包材 5%</span></div>
    <div class="tbl-wrap"><table class="tbl" style="min-width:0">
      <thead><tr><th style="width:120px">包材项</th><th>规格要求</th></tr></thead>
      <tbody>${rows.map(([k, v]) => `<tr><td><b>${esc(k)}</b></td><td>${esc(v)}</td></tr>`).join('')}</tbody>
    </table></div>
    <p class="note-strip mt">皮质笔 / 毛球笔入展示盒：先上一层热收缩膜再贴不干胶，需向客人说明。完整规则见下方业务环节 SOP。</p>
  </div>`;
}

/* 15 收尾：出运后合规与收汇清单 */
function areaCloseout(n) {
  const list = sopOf('15');
  return `<div class="card mt">
    <h3>出运后收尾清单 <span class="tag m">${list.length} 项</span>
      <span style="flex:1"></span>
      <span class="tag">deadline ${n.deadline}（出运后 30 天）</span></h3>
    <p class="note-strip" style="margin-bottom:10px">这些环节最容易漏——BCI 棉要等客户群通知、EUDR 与 FSC 发票各有登记入口。系统按项目逐项跟踪，不再靠人记。</p>
    <div class="grid g2">
      ${list.map((s, i) => `<label class="chk ${n.todos[i] && n.todos[i].done ? 'done' : ''}">
        <input type="checkbox" ${n.todos[i] && n.todos[i].done ? 'checked' : ''} ${canEdit() ? '' : 'disabled'} data-chg="todo" data-i="${i}">
        <span>${esc(s.name)}${s.when ? `<br><span style="color:var(--muted);font-size:12.5px">⏱ ${esc(s.when)}</span>` : ''}</span>
      </label>`).join('')}
    </div>
  </div>`;
}

function areaBrief(p) {
  const q = ui.briefFilter.trim().toUpperCase();
  const list = p.skus.filter(s => !q || s.artNo.toUpperCase().includes(q) || CATS[s.cat].includes(q) || s.name.includes(q));
  return `
  <div class="card mt">
    <h3>Brief · SKU 清单 <span class="tag">筛选编号，品类就出来了</span></h3>
    <div class="filterbar">
      <input class="ipt search" placeholder="按货号 / 品类筛选，如 HM-NB" value="${esc(ui.briefFilter)}" data-chg="brief-filter">
      ${canEdit() ? `<button class="btn" data-act="recalc">按交期倒推重算时间线</button>` : ''}
      <span class="note-strip">命中 ${list.length} / ${p.skus.length} 款</span>
    </div>
    <div class="tbl-wrap"><table class="tbl">
      <thead><tr><th>货号</th><th>品名</th><th>品类</th><th>客户目标价</th></tr></thead>
      <tbody>${list.map(s => `<tr><td class="num">${esc(s.artNo)}</td><td>${s.ph} ${esc(s.name)}</td>
        <td><span class="tag">${CATS[s.cat]}</span></td><td class="num">$${s.target.toFixed(2)}</td></tr>`).join('')}</tbody>
    </table></div>
  </div>`;
}

function areaPsfList(p) {

      <tbody>${p.skus.map(s => {

  </div>`;
}

    <div class="tbl-wrap"><table class="tbl">

    <h3 class="mt">CQV 开发样评估（寄样前完成）</h3>
    ${cqvs.length ? `<div class="tbl-wrap"><table class="tbl">
      <thead><tr><th>SKU</th><th>评估项</th><th>结论</th><th>备注</th><th>评估人</th></tr></thead>
      <tbody>${cqvs.map(c => `<tr><td class="num">${esc(c.sku)}</td><td>${esc(c.item)}</td>
        <td>${c.result === '通过' ? '<span class="tag m">通过</span>' : `<span class="tag a">${esc(c.result)}</span>`}</td>
        <td>${esc(c.note)}</td><td>${esc(c.by)}</td></tr>`).join('')}</tbody></table></div>` : '<div class="empty">暂无评估记录</div>'}
    <h3 class="mt">寄样套数速查 <span class="tag">按客户要求执行，漏寄要补运费</span></h3>
    <div class="tbl-wrap"><table class="tbl" style="min-width:0">
      <thead><tr><th style="width:130px">样品类型</th><th>寄送要求</th></tr></thead>
      <tbody>
        <tr><td><b>Offer 样</b></td><td>荷兰 / 上海办各 1 套，展示盒里不含产品</td></tr>
        <tr><td><b>PP 样</b></td><td>荷兰 / 上海办各 1 套，展示盒里不含产品</td></tr>
        <tr><td><b>大货样</b></td><td>2 套给荷兰、1 套给上海办、1 套给 TUV 验货；到齐后再补寄 1 套拍照样给上海办</td></tr>
      </tbody></table></div>
    <h3 class="mt">样品照片墙
      ${canEdit() ? `<button class="btn sm" data-act="upload" data-kind="photo" data-pid="${p.id}" style="margin-left:8px">＋ 上传样品照片</button>` : ''}
      <span class="tag">${(p.photos || []).length}/12</span></h3>
    <div class="prod-grid">${(p.photos && p.photos.length)
      ? p.photos.map((ph, i) => `<div class="prod"><div class="ph img"><img src="${ph.thumb}" alt="${esc(ph.name)}"></div>
          <div class="m" style="margin-top:6px">${esc(ph.name)}</div>
          ${canEdit() ? `<button class="btn sm" style="margin-top:6px" data-act="photo-del" data-i="${i}">删除</button>` : ''}</div>`).join('')
      : p.skus.slice(0, 4).map(s => `<div class="prod"><div class="ph">${s.ph}</div>
          <div class="a">${esc(s.artNo)}</div><div class="n">${esc(s.name)}</div><div class="m">样品照片占位 · 可上传真实照片</div></div>`).join('')}</div>

function areaFS(p, n) {
  const locked = !!n.fsLocked;
  return `
  <div class="card mt">
    <h3>FS 汇总表 <span class="tag b">供应链透明化 · 每款填明工厂</span>
      ${locked ? '<span class="badge-final">FINAL 已锁定</span>' : ''}
      <span style="flex:1"></span>
      ${canEdit() ? (locked
        ? `<button class="btn sm" data-act="fs-unlock">解锁（需原因）</button>`
        : `<button class="btn sm pri" data-act="fs-lock">锁定 Final 版本</button>`) : ''}
    </h3>
    ${ui.fsUnlockOpen && locked ? `<div class="reject-box">
      <input class="ipt" id="fsReason" placeholder="解锁原因（将写入版本记录）…">
      <div class="btnrow mt"><button class="btn danger" data-act="fs-unlock-confirm">确认解锁</button>
      <button class="btn ghost" data-act="fs-unlock-cancel">取消</button></div></div>` : ''}
    <div class="tbl-wrap"><table class="tbl">
      <thead><tr><th>货号</th><th>品名</th><th>对客价</th><th>最终供应商（从候选带入）</th></tr></thead>
      <tbody>${p.skus.map(s => {
        const opts = (s.cand.length ? s.cand : db.suppliers.filter(x => x.categories.includes(s.cat)).map(x => x.id));
        return `<tr><td class="num">${esc(s.artNo)}</td><td>${s.ph} ${esc(s.name)}</td><td class="num">$${s.quote.toFixed(2)}</td>
        <td>${canEdit() && !locked ? `<select class="ipt ipt-inline" data-chg="fs-final" data-sku="${s.id}">
          <option value="">— 未指定 —</option>
          ${opts.map(id => `<option value="${id}" ${s.final === id ? 'selected' : ''}>${esc(supplier(id).name)}</option>`).join('')}
        </select>` : (s.final ? `<span class="tag b">${esc(supplier(s.final).name)}</span>` : '<span class="tag">未指定</span>')}
        ${s.cand.length ? `<span class="tag" style="margin-left:6px">候选 ${s.cand.length}</span>` : ''}</td></tr>`;
      }).join('')}</tbody></table></div>
    <p class="note-strip mt">锁定后表格只读；解锁必须填写原因并写入版本记录——对应「FS 改来改去，改得不正确了」的痛点。</p>
  </div>`;
}

function areaInspect(p, n) {
  const recs = db.inspections.filter(r => r.projectId === p.id && r.nodeId === n.id);
  const kind = n.id === '12' ? 'DUPRO · 中期验货（大货完成约 10% 时）' : 'FRI · 大货验货（大货完成后）';
  return `
  ${n.id === '13' ? `<div class="riskbar mt" style="cursor:default">⏰ 验货需至少提前一周以上预订
    <span class="cool">BTS 出货季 TUV 可能排不上；外厂验货须提前告知工厂、备好公关费与签样，验完索取签字单照片</span></div>` : ''}
  <div class="card mt">
    <h3>验货记录 <span class="tag k">${kind}</span></h3>
    ${recs.length ? recs.map(r => `
      <div class="note-strip" style="margin-bottom:10px">检验时间 ${esc(r.time)} · ${esc(r.progress)} · 第三方执行（TUV 占位）</div>
      <div class="tbl-wrap"><table class="tbl">
        <thead><tr><th>检验项</th><th>结果</th><th>问题描述</th><th>整改状态</th></tr></thead>
        <tbody>${r.items.map(it => `<tr class="${it.result === 'fail' ? 'critical' : ''}">
          <td>${esc(it.item)}</td><td>${it.result === 'pass' ? '<span class="tag m">PASS</span>' : '<span class="tag r">FAIL</span>'}</td>
          <td>${esc(it.issue) || '—'}</td><td>${esc(it.fix) || '—'}</td></tr>`).join('')}</tbody>
      </table></div>`).join('') : `<div class="empty">${n.id === '12' ? '大货开始后自动排期（待开始）' : '大货完成后进行（待开始）'}</div>`}
  </div>`;
}

/* ---------- PSF 编辑器 ---------- */

}

  <div class="crumb"><a href="#/projects">项目管理</a> / <a href="#/projects/${p.id}">${esc(p.name)}</a> /

  <div class="psf-bar">
    <span class="lang-toggle">
      <button class="${L === 'zh' ? 'on' : ''}" data-act="psf-lang" data-l="zh">中文</button>
      <button class="${L === 'en' ? 'on' : ''}" data-act="psf-lang" data-l="en">EN</button>
    </span>
    ${canEdit() ? `
      <button class="btn" data-act="ovl-import">导入客户 PSF</button>
      <button class="btn" data-act="psf-save" ${f.locked ? 'disabled' : ''}>保存为新版本</button>

                 : `<button class="btn mint" data-act="psf-lock">锁定为 Final</button>`}
      <span style="flex:1"></span>
      <button class="btn pri" data-act="ovl-quote">生成报价单</button>
      <button class="btn pri" data-act="ovl-order">生成下单资料</button>
      <button class="btn" data-act="ovl-en">导出英文版</button>` : ''}
  </div>
  ${ui.psfUnlockOpen && f.locked ? `<div class="card reject-box"><input class="ipt" id="psfReason" placeholder="解锁原因（写入版本记录）…">
    <div class="btnrow mt"><button class="btn danger" data-act="psf-unlock-confirm">确认解锁</button>
    <button class="btn ghost" data-act="psf-unlock-cancel">取消</button></div></div>` : ''}
  <div class="card psf-sec"><h3>产品描述</h3>

/* ---------- 供应商管理 ---------- */
function auditState(s) {
  if (s.auditStatus === 'expired') return 'expired';
  if (s.auditStatus === 'pending') return 'pending';
  if (s.auditStatus === 'rectification' || (s.audits || []).some(a => a.rectification === '整改中')) return 'rectification';
  if (s.auditExpiry && diffDays(TODAY, s.auditExpiry) <= 90) return 'expiring';
  return 'valid';
}
function auditPill(s) {
  const st = auditState(s);
  if (st === 'valid') return `<span class="tag m">验厂通过 · 至 ${esc(s.auditExpiry)}</span>`;
  if (st === 'expiring') return `<span class="tag a">验厂即将到期 · ${esc(s.auditExpiry)}（剩 ${diffDays(TODAY, s.auditExpiry)} 天）</span>`;
  if (st === 'rectification') return '<span class="tag r">验厂整改中 · 未闭环</span>';
  if (st === 'pending') return '<span class="tag a">验厂待审（TUV 排期中）</span>';
  return `<span class="tag r">验厂已过期 · ${esc(s.auditExpiry)}</span>`;
}

/* ---------- 质量管控 ---------- */
function riskRows() {
  const rows = [];
  db.projects.forEach(p => p.skus.forEach(s => {
    const f = db.psfs[s.id];
    if (!f) return;
    f.sections.compliance.forEach(r => {
      if (r.critical) rows.push({ p, s, f, r });
    });
  }));
  return rows;
}
function inspClosed(it) { return it.result === 'fail' && it.fix && it.fix.startsWith('已闭环'); }
function projectSupplierIds(p) {
  const ids = new Set();
  p.skus.forEach(s => { (s.cand || []).forEach(id => ids.add(id)); if (s.final) ids.add(s.final); });
  return ids;
}
function projectSkusOf(p, supId) {
  return p.skus.filter(s => s.final === supId || (s.cand || []).includes(supId))
    .map(s => ({ artNo: s.artNo, locked: s.final === supId }));
}

/* ---------- 客户管理 · SOP 手册 ---------- */
function viewClientSop() {
  const q = ui.sopQ.trim();
  const PH = ui.sopPhase;
  const hit = s => (!q || s.name.includes(q) || s.notes.join('').includes(q) || (s.when || '').includes(q))
    && (PH === 'all' || nodeDef(s.node).phase === PH);
  const list = SOP.filter(hit);
  const groups = { dev: [], pre: [], end: [] };
  list.forEach(s => groups[nodeDef(s.node).phase].push(s));
  const noteCount = SOP.reduce((a, s) => a + s.notes.length, 0);

  return `
  <div class="page-head"><h1>客户管理 · SOP 手册</h1>
    <span class="tag b">HEMA · THEME 线</span>
    <span class="sub">${SOP.length} 个业务环节 · ${noteCount} 条注意事项 ｜ 新人通读，老人速查</span></div>
  <p class="note-strip" style="margin-bottom:14px">HEMA 全流程业务环节与执行要求，按开发 / 中期 / 尾期三阶段排列。各环节的 SOP 文件与项目资料按内部规范存取。Brand 线规则待补充，卡片标注 <span class="tag b">THEME</span> 以便日后并列呈现。</p>
  <div class="filterbar">
    <input class="ipt search" placeholder="搜索环节 / 注意事项全文，如「PVC」「寄样」「汇率」…" value="${esc(ui.sopQ)}" data-chg="sop-q">
    <div class="tabs" style="margin:0;border:0">
      ${[['all', '全部'], ['dev', '开发阶段'], ['pre', '中期 · 产前'], ['end', '尾期']].map(([k, l]) =>
        `<button class="${PH === k ? 'on' : ''}" data-act="sop-phase" data-p="${k}">${l}</button>`).join('')}
    </div>
    <span class="note-strip">命中 ${list.length} / ${SOP.length}</span>
  </div>
  ${['dev', 'pre', 'end'].map(ph => groups[ph].length ? `
    <div class="page-head" style="margin:22px 0 10px"><h1 style="font-size:17px">${PHASES[ph].label}</h1>
      <span class="sub">${groups[ph].length} 个环节</span></div>
    ${groups[ph].map(s => `<div class="card mt sop-card ph-${ph}">
      <div class="sop-head" style="cursor:default">
        <span class="sop-name" style="font-size:15px">${esc(s.name)}</span>
        <span class="tag b" data-act="goto" data-href="#/projects/p1/node/${s.node}" style="cursor:pointer">节点 ${s.node} ${nodeDef(s.node).name}</span>
        ${s.when ? `<span class="sop-when">⏱ ${esc(s.when)}</span>` : ''}
        <span style="margin-left:auto"><span class="tag">THEME</span></span>
      </div>
      ${s.notes.length ? `<div class="sop-body">${sopNotes(s)}</div>`
        : '<div class="sop-body" style="color:var(--muted);font-size:13.5px">按标准流程执行，暂无特别注意事项；参考相关 SOP 文件</div>'}
    </div>`).join('')}` : '').join('')}
  ${list.length ? '' : '<div class="card mt"><div class="empty">无匹配环节，换个关键词试试</div></div>'}`;
}

/* ---------- 管理者看板 ---------- */
function viewDashboard() {
  const projs = db.projects.filter(p => p.status === 'active');
  const overs = [];
  projs.forEach(p => p.nodes.filter(isOverdue).forEach(n => overs.push({ p, n })));
  const reviews = [];
  projs.forEach(p => p.nodes.filter(n => n.status === 'review').forEach(n => reviews.push({ p, n })));
  const byOwner = {};
  projs.forEach(p => activeNodes(p).forEach(n => {
    const nm = person(n.ownerId).name;
    byOwner[nm] = (byOwner[nm] || 0) + 1;
  }));
  const ranks = Object.entries(byOwner).sort((a, b) => b[1] - a[1]);
  const maxR = ranks.length ? ranks[0][1] : 1;
  return `
  <div class="page-head"><h1>数据看板</h1><span class="sub">谁卡在哪一步，不用催都知道 ｜ 今天：${TODAY}</span></div>
  <div class="grid g4">
    <div class="card statcard brand"><div class="num">${projs.length}</div><div class="lbl">进行中项目</div></div>
    <div class="card statcard warn"><div class="num">${overs.length}</div><div class="lbl">逾期节点</div></div>
    <div class="card statcard"><div class="num">${reviews.length}</div><div class="lbl">待审批 / 待确认</div></div>
    <div class="card statcard mint"><div class="num">${projs.reduce((s, p) => s + activeNodes(p).length, 0)}</div><div class="lbl">活跃节点</div></div>
  </div>
  <div class="card mt">
    <h3>项目 × 节点 进度矩阵</h3>
    <div class="matrix-wrap"><table class="matrix">
      <thead><tr><th></th>${NODE_DEFS.map(d => `<th>${d.id}<br>${d.code}</th>`).join('')}</tr></thead>
      <tbody>${projs.map(p => `<tr><td class="pname">${esc(p.name)}</td>
        ${p.nodes.map(n => `<td><div class="mcell s-${n.status} ${isOverdue(n) ? 'ov' : ''}"
          title="${n.id} ${nodeDef(n.id).name} · ${STATUS_LABEL[n.status]}${isOverdue(n) ? ' · 逾期' : ''}"
          data-act="goto" data-href="#/projects/${p.id}/node/${n.id}">${n.id}</div></td>`).join('')}</tr>`).join('')}
      </tbody></table></div>
    <div class="legend">
      <span><i style="background:var(--surface-2)"></i>未开始</span>
      <span><i style="background:var(--brand)"></i>进行中</span>
      <span><i style="background:var(--amber)"></i>待审批</span>
      <span><i style="background:var(--mint)"></i>已完成</span>
      <span><i style="background:var(--surface-2);box-shadow:inset 0 0 0 2px var(--red)"></i>逾期</span>
    </div>
  </div>
  <div class="grid g2 mt">
    <div class="card"><h3>逾期清单</h3>
      ${overs.length ? `<div class="tbl-wrap"><table class="tbl">
        <thead><tr><th>项目</th><th>节点</th><th>负责人</th><th>deadline</th><th>逾期</th></tr></thead>
        <tbody>${overs.map(({ p, n }) => `<tr>
          <td>${esc(p.name)}</td><td><a href="#/projects/${p.id}/node/${n.id}">${n.id} ${nodeDef(n.id).name}</a></td>
          <td>${esc(person(n.ownerId).name)}</td><td class="num">${n.deadline}</td>
          <td><span class="tag r">${diffDays(n.deadline, TODAY)} 天</span></td></tr>`).join('')}</tbody></table></div>` : '<div class="empty">无逾期节点 🎉</div>'}
    </div>
    <div class="card"><h3>卡点排行（按负责人）</h3>
      ${ranks.map(([nm, c]) => `<div style="display:flex;align-items:center;gap:10px;padding:7px 0">
        ${avatarOf(nm)}
        <div style="flex:1;background:var(--surface-2);border-radius:6px;height:14px;overflow:hidden">
          <div style="width:${Math.round(c / maxR * 100)}%;height:100%;background:var(--brand)"></div></div>
        <b class="mono">${c} 项</b></div>`).join('')}
      <p class="note-strip mt">活跃（进行中 + 待审批）节点按负责人聚合。</p>
    </div>
  </div>`;
}
