function renderOverlay() {
  const o = ui.overlay;
  if (!o) return '';
  const p = o.pid ? proj(o.pid) : null;
  const s = o.skuId && p ? skuOf(p, o.skuId) : null;
  const f = s ? db.psfs[s.id] : null;

  if (o.kind === 'cqvNew') {
    const d = ui.cqvDraft;
    const pp = proj(d.projectId) || db.projects[0];
    return `
    <div class="ovl">
      <div class="ovl-actions"><button class="btn" data-act="ovl-close">关闭</button></div>
      <div class="sheet" style="max-width:620px">
        <div class="sheet-head"><span class="mk"><i></i><i></i></span><h2>新增 CQV 开发样评估</h2></div>
        <div class="sheet-sub">寄样前完成评估，要求在打样前传达工厂——避免样品出来才发现结构或工艺不达标。</div>
        <div class="form-row"><label>项目 *</label><select class="ipt" data-chg="cq-proj">
          ${db.projects.filter(x => x.status === 'active').map(x =>
            `<option value="${x.id}" ${d.projectId === x.id ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}
        </select></div>
        <div class="form-row"><label>SKU *</label><select class="ipt" data-chg="cq-sku">
          <option value="">— 请选择 —</option>
          ${pp.skus.map(k => `<option value="${esc(k.artNo)}" ${d.sku === k.artNo ? 'selected' : ''}>${esc(k.artNo)} ${esc(k.name)}</option>`).join('')}
        </select></div>
        <div class="form-row"><label>评估项 *</label><input class="ipt" placeholder="如：开口圈直径 ≥ 2.5cm / 车缝拉力 ≥ 70N" value="${esc(d.item)}" data-chg="cq-item"></div>
        <div class="form-row"><label>结论</label><select class="ipt" data-chg="cq-result">
          <option ${d.result === '通过' ? 'selected' : ''}>通过</option>
          <option ${d.result === '整改后复评' ? 'selected' : ''}>整改后复评</option>
          <option ${d.result === '不通过' ? 'selected' : ''}>不通过</option></select></div>
        <div class="form-row"><label>备注</label><input class="ipt" placeholder="评估说明、已传达工厂的要求…" value="${esc(d.note)}" data-chg="cq-note"></div>
        <div class="form-row"><label>评估人</label><input class="ipt" value="CQV 审核" disabled></div>
        <div class="btnrow mt"><span style="flex:1"></span>
          <button class="btn pri" data-act="cqv-create">保存评估</button></div>
      </div>
    </div>`;
  }

  if (o.kind === 'newProj') {
    const d = ui.newProj;
    const catCount = {};
    db.projects.forEach(pp => pp.skus.forEach(x => { catCount[x.cat] = (catCount[x.cat] || 0) + 1; }));
    const catSeen = {};
    const rows = d.skus.map((x, i) => {
      const k = x.cat || 'NB';
      catSeen[k] = (catSeen[k] || 0) + 1;
      const art = 'HM-' + k + '-' + String((catCount[k] || 0) + catSeen[k]).padStart(3, '0');
      return `<div class="sku-row">
        <span class="art">${art}</span>
        <input class="ipt" placeholder="品名" value="${esc(x.name)}" data-chg="np-sku" data-f="name" data-i="${i}">
        <select class="ipt" data-chg="np-sku" data-f="cat" data-i="${i}">
          ${Object.keys(CATS).map(c => `<option value="${c}" ${k === c ? 'selected' : ''}>${CATS[c]}</option>`).join('')}
        </select>
        <input class="ipt" type="number" step="0.01" placeholder="目标价 $" value="${esc(x.target)}" data-chg="np-sku" data-f="target" data-i="${i}">
        <button class="x" data-act="np-sku-del" data-i="${i}" title="删除">✕</button>
      </div>`;
    }).join('');
    return `
    <div class="ovl">
      <div class="ovl-actions"><button class="btn" data-act="ovl-close">关闭</button></div>
      <div class="sheet">
        <div class="sheet-head"><span class="mk"><i></i><i></i></span><h2>新建项目</h2></div>
        <div class="sheet-sub">录入客户 Brief 并建立产品开发项目；选择客户标准版本后生成项目快照，SKU 独立推进 02–09。</div>
        <div class="grid g2">
          <div>
            <div class="form-row"><label>项目名称 *</label><input class="ipt" placeholder="如 Gift 2027" value="${esc(d.name)}" data-chg="np-name"></div>
            <div class="form-row"><label>客户</label><input class="ipt" value="HEMA" disabled></div>
            <div class="form-row"><label>客户标准版本</label><select class="ipt" data-v7chg="np-standard"><option value="HEMA-STD-2026.3" ${d.standardVersion==='HEMA-STD-2026.3'?'selected':''}>HEMA-STD-2026.3（当前）</option><option value="HEMA-STD-2026.2" ${d.standardVersion==='HEMA-STD-2026.2'?'selected':''}>HEMA-STD-2026.2</option></select></div>
            <div class="form-row"><label>季节</label><input class="ipt" placeholder="如 2027 夏季" value="${esc(d.season)}" data-chg="np-season"></div>
          </div>
          <div>
            <div class="form-row"><label>交期 *</label><input class="ipt" type="date" value="${esc(d.delivery)}" data-chg="np-delivery"></div>
            <div class="form-row"><label>负责人</label><select class="ipt" data-chg="np-owner">
              <option value="u1" ${d.owner === 'u1' ? 'selected' : ''}>业务A</option>
              <option value="u2" ${d.owner === 'u2' ? 'selected' : ''}>业务B</option></select></div>
          </div>
        </div>
        <h3 style="font-size:15px;margin:14px 0 8px">客户 Brief 文件
          <button class="btn sm" data-act="upload" data-kind="npBrief" style="margin-left:8px">＋ 上传 Brief</button></h3>
        ${d.files.length ? d.files.map((f, i) => `<div class="file-item">${fileIcon(f.name)} ${esc(f.name)}
          <span class="fmeta">${fmtSize(f.size)}</span>
          <button class="del" data-act="np-file-del" data-i="${i}">✕</button></div>`).join('')
        : '<div class="empty" style="padding:6px 0">尚未上传（将写入节点 01 的输入资料）</div>'}
        <h3 style="font-size:15px;margin:14px 0 8px">初始 SKU 清单（可空，创建后继续补充）</h3>
        ${rows || '<div class="empty" style="padding:8px 0">尚未添加 SKU</div>'}
        <div class="btnrow mt">
          <button class="btn" data-act="np-sku-add">＋ 添加 SKU</button>
          <span style="flex:1"></span>
          <button class="btn pri" data-act="np-create">创建项目</button>
        </div>
      </div>
    </div>`;
  }

  if (o.kind === 'import') {
    return `
    <div class="ovl">
      <div class="ovl-actions"><button class="btn" data-act="ovl-close">关闭</button></div>
      <div class="sheet">
        <div class="sheet-head"><span class="mk"><i></i><i></i></span><h2>导入客户 PSF（演示）</h2></div>
        <div class="sheet-sub">粘贴 / 选择客户 PSF 原文 → 自动解析为结构化规格 → 生成中文工厂版（演示交互，不做真实解析）</div>
        <div class="raw">Item: ${esc(s.artNo)}  ${esc(s.name)}
Cover: 2mm greyboard, 157gsm art paper, matt lamination
Inner: 96 sheets, 80gsm woodfree, 4C printing
Binding: twin wire-o, black, dia. 8mm
Packing: hangtag 300gsm w/ barcode; self-adhesive OPP bag w/ warning
Compliance: REACH Annex XVII; EN71-3 migration; FSC paper</div>
        ${o.parsing ? '<div class="spin"></div><div class="empty">正在解析并分类（规格 / 包材 / 法规）…</div>'
          : `<div class="btnrow mt"><button class="btn pri" data-act="import-parse">解析并导入</button></div>`}
      </div>
    </div>`;
  }

  if (o.kind === 'quote') {
    return ovlShell('客户报价单', `由 PSF 数据自动生成 · ${esc(s.artNo)} · 版本 ${esc(f.version)} · 生成时间 ${nowStamp()}`, `
      <div class="tbl-wrap"><table class="tbl">
        <thead><tr><th>货号</th><th>图</th><th>品名 / 描述</th><th>对客报价</th><th>包装</th><th>备注</th></tr></thead>
        <tbody><tr>
          <td class="num">${esc(s.artNo)}</td><td style="font-size:28px">${s.ph}</td>
          <td><b>${esc(s.name)}</b><br><span style="color:var(--muted)">${esc(f.sections.productDesc.zh)}</span></td>
          <td class="num"><b>$${s.quote.toFixed(2)}</b></td>
          <td>${f.sections.packaging.map(x => esc(x.item)).join(' / ')}</td>
          <td>MOQ 3,000 · FOB Ningbo</td>
        </tr></tbody></table></div>
      <p class="note-strip mt">同源演示：修改 PSF 后重新生成，此表数据随之变化。</p>`);
  }

  if (o.kind === 'order') {
    return ovlShell('下单资料（构件清单 + 包装清单）', `本地 AI 按公司模板从 Final 规格书生成（演示） · ${esc(s.artNo)}`, `
      <h3 style="font-size:15px">产品描述</h3>
      <p style="font-size:14px">${esc(f.sections.productDesc.zh)}</p>
      <h3 style="font-size:15px">构件清单</h3>
      <div class="tbl-wrap"><table class="tbl"><thead><tr><th>部件</th><th>规格</th></tr></thead>
        <tbody>${f.sections.construction.map(r => `<tr><td>${esc(r.part)}</td><td>${esc(r.zh)}</td></tr>`).join('')}</tbody></table></div>
      <h3 style="font-size:15px" class="mt">包装清单</h3>
      <div class="tbl-wrap"><table class="tbl"><thead><tr><th>包材项</th><th>规格</th></tr></thead>
        <tbody>${f.sections.packaging.map(r => `<tr><td>${esc(r.item)}</td><td>${esc(r.zh)}</td></tr>`).join('')}</tbody></table></div>
      <p class="note-strip mt">资料审核员只需复核差异字段——「一处录入，多处复用」。</p>`);
  }

  if (o.kind === 'en') {
    return ovlShell('PSF — Product Specification (EN)', `${esc(s.artNo)} · ${esc(s.name)} · Version ${esc(f.version)}${f.locked ? ' · FINAL' : ''}`, `
      <p style="font-size:14px"><b>Description:</b> ${esc(f.sections.productDesc.en)}</p>
      <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Part</th><th>Specification</th></tr></thead>
        <tbody>${f.sections.construction.map(r => `<tr><td>${esc(r.part)}</td><td>${esc(r.en)}</td></tr>`).join('')}</tbody></table></div>
      <div class="tbl-wrap mt"><table class="tbl"><thead><tr><th>Packaging</th><th>Specification</th></tr></thead>
        <tbody>${f.sections.packaging.map(r => `<tr><td>${esc(r.item)}</td><td>${esc(r.en)}</td></tr>`).join('')}</tbody></table></div>
      <div class="tbl-wrap mt"><table class="tbl"><thead><tr><th>Compliance</th><th>Requirement</th></tr></thead>
        <tbody>${f.sections.compliance.map(r => `<tr class="${r.critical ? 'critical' : ''}"><td>${esc(r.type)}</td><td>${esc(r.requirement)}${r.critical ? ' <span class="tag r">CRITICAL</span>' : ''}</td></tr>`).join('')}</tbody></table></div>`);
  }

  if (o.kind === 'ppt') {
    return ovlShell(`${esc(p.name)} · 样品清单 PPT`, `照片上传后一键生成（演示） · 共 ${p.skus.length} 款 · ${nowStamp()}`, `
      <div class="prod-grid" style="grid-template-columns:repeat(2,1fr)">
        ${p.skus.map((x, i) => {
          const pho = p.photos && p.photos[i];
          return `<div class="slide"><div class="ph ${pho ? 'img' : ''}">${pho ? `<img src="${pho.thumb}" alt="">` : x.ph}</div>
          <div class="a">${esc(x.artNo)}</div><b>${esc(x.name)}</b>
          <div class="p">对客报价 $${x.quote.toFixed(2)} · ${CATS[x.cat]}</div></div>`;
        }).join('')}
      </div>`);
  }

  if (o.kind === 'supquotes') {
    const sups = db.suppliers.filter(x => p.skus.some(k => k.cand.includes(x.id)));
    return ovlShell('分供应商报价单', `按候选供应商分组导出 · 多家可做的款式同时出现在各家单中 · 内部文件（含成本，不对客户展示）`, `
      ${sups.length ? sups.map(sp => {
        const items = p.skus.filter(k => k.cand.includes(sp.id));
        return `<h3 style="font-size:15px" class="mt">${esc(sp.name)} <span class="tag">周期 ${sp.leadTimeDays} 天</span> <span class="tag">共 ${items.length} 款</span></h3>
        <div class="tbl-wrap"><table class="tbl">
          <thead><tr><th>货号</th><th>品名</th><th>目标价</th><th>对客报价</th><th>内部成本</th></tr></thead>
          <tbody>${items.map(k => `<tr><td class="num">${esc(k.artNo)}</td><td>${k.ph} ${esc(k.name)}</td>
            <td class="num">$${k.target.toFixed(2)}</td><td class="num">$${k.quote.toFixed(2)}</td>
            <td class="num" style="color:var(--red)">$${k.cost.toFixed(2)}</td></tr>`).join('')}</tbody></table></div>`;
      }).join('') : '<div class="empty">暂无候选供应商，请先在 Tender 节点完成匹配</div>'}`);
  }

  if (o.kind === 'fslist') {
    const items = p.skus.filter(k => k.final);
    return ovlShell('FS 最终供应商名单', `供应链透明化 · 仅名单（明细报价与成本不对外）`, `
      <div class="tbl-wrap"><table class="tbl"><thead><tr><th>货号</th><th>品名</th><th>最终供应商</th></tr></thead>
        <tbody>${items.map(k => `<tr><td class="num">${esc(k.artNo)}</td><td>${k.ph} ${esc(k.name)}</td>
        <td><span class="tag b">${esc(supplier(k.final).name)}</span></td></tr>`).join('')}</tbody></table></div>`);
  }

  if (o.kind === 'prod') {
    const x = db.clientProducts.find(y => y.id === o.id);
    return ovlShell(`${esc(x.artNo)} · ${esc(x.name)}`, `${x.year} · ${esc(x.project)} · ${CATS[x.cat]} · 过往产品库`, `
      <div style="font-size:52px;text-align:center;background:var(--surface-2);border-radius:12px;padding:26px 0">${x.ph}</div>
      <h3 style="font-size:15px" class="mt">可复用标准描述</h3>
      <p style="font-size:14.5px;background:var(--mint-soft);border-radius:10px;padding:12px 14px">${esc(x.desc)}</p>
      <div class="btnrow"><button class="btn pri" data-act="copy-desc" data-id="${x.id}">📋 复制标准描述</button></div>
      <p class="note-strip mt">老品换设计时直接复用描述，改参数即可——不再依赖老员工记忆。</p>`);
  }
  return '';
}

function renderPanel() {
  const pl = ui.panel;
  if (!pl) return '';
  if (pl.kind === 'match') {
    const p = proj(pl.pid), s = skuOf(p, pl.skuId);
    const hits = db.suppliers.filter(x => x.categories.includes(s.cat));
    return `
    <div class="panel-mask" data-act="panel-close"></div>
    <div class="panel">
      <div class="p-head"><h3>供应商匹配 · ${esc(s.artNo)}</h3><button class="x" data-act="panel-close">✕</button></div>
      <div class="p-body">
        <p class="note-strip" style="margin-bottom:12px">品类：<b>${CATS[s.cat]}</b> · 命中 <b>${hits.length} / ${db.suppliers.length}</b> 家 · 最多选 3 家加入候选</p>
        ${hits.map(x => `
          <label class="sup-row ${pl.sel.includes(x.id) ? 'on' : ''}">
            <input type="checkbox" ${pl.sel.includes(x.id) ? 'checked' : ''} data-chg="match-sel" data-id="${x.id}">
            <div><div class="s-name">${esc(x.name)} <span class="mono" style="color:var(--amber);font-size:12px">${stars(x.rating)}</span></div>
              <div class="s-meta"><span>周期 ${x.leadTimeDays} 天</span><span>均价 ${esc(x.priceBand)}</span><span>开模 ${esc(x.mold)}</span>
                <span>${x.auditStatus === 'passed' ? '验厂✓' : x.auditStatus === 'pending' ? '验厂待审' : '<b style="color:var(--red)">验厂过期</b>'}</span></div>
              <div class="s-meta">${x.clients.map(c => `<span class="tag k">${esc(c)}</span>`).join(' ')} ${x.processes.map(c => `<span class="tag">${esc(c)}</span>`).join(' ')}</div>
            </div>
          </label>`).join('')}
      </div>
      <div class="p-foot"><button class="btn ghost" data-act="panel-close">取消</button>
        <button class="btn pri" data-act="match-save">保存候选（${pl.sel.length}）</button></div>
    </div>`;
  }
  if (pl.kind === 'supplier') {
    const x = supplier(pl.id);
    const skuRows = [];
    db.projects.forEach(p => p.skus.forEach(k => {
      if (k.final === x.id) skuRows.push({ p, k, locked: true });
      else if (k.cand.includes(x.id)) skuRows.push({ p, k, locked: false });
    }));
    return `
    <div class="panel-mask" data-act="panel-close"></div>
    <div class="panel">
      <div class="p-head"><h3>${esc(x.name)}</h3>
        <span class="mono" style="color:var(--amber);font-size:13px">${stars(x.rating)}</span>
        ${canEdit() ? `<button class="btn sm" data-act="sup-edit-open" data-id="${x.id}">✎ 编辑</button>` : ''}
        <button class="x" data-act="panel-close">✕</button></div>
      <div class="p-body">
        <div class="sec-title">基本能力（越细，AI 匹配越准）</div>
        <div class="meta" style="font-size:14px;display:grid;gap:6px">
          <div>品类：${x.categories.map(c => `<span class="tag b">${CATS[c]}</span>`).join(' ')}</div>
          <div>工艺：${x.processes.map(c => `<span class="tag">${esc(c)}</span>`).join(' ')}</div>
          <div>开模：${esc(x.mold)} ｜ 周期：<b class="mono">${x.leadTimeDays} 天</b> ｜ 均价：<b class="mono">${esc(x.priceBand)}</b></div>
          <div>地区：${esc(x.region || '—')} ｜ 月产能：<b class="mono">${esc(x.capacity || '—')}</b> ｜ MOQ：<b class="mono">${esc(x.moq || '—')}</b></div>
          <div>合作：${x.clients.map(c => `<span class="tag k">${esc(c)}</span>`).join(' ')} · ${x.yearsCoop || 0} 年 ｜ 联系人：${esc(x.contact || '—')}</div>
        </div>
        <div class="sec-title mt">验厂档案</div>
        <div style="margin-bottom:8px">${auditPill(x)}</div>
        ${(x.audits || []).length ? (x.audits || []).map(a => `<div class="ver">
          <span class="v">${esc(a.type)}</span><span>${esc(a.result)}${a.expiry ? ` · 有效期至 ${esc(a.expiry)}` : ''}</span>
          <span class="d">${esc(a.date)}</span></div>`).join('') : '<div class="empty">暂无验厂记录</div>'}
        ${x.certs.length ? `<div class="btnrow mt">${x.certs.map(c => `<span class="tag">${esc(c)}</span>`).join(' ')}</div>` : ''}
        <div class="sec-title mt">近期报价（内部）</div>
        ${(x.quotes || []).length ? `<div class="tbl-wrap"><table class="tbl" style="min-width:0">
          <thead><tr><th>货号</th><th>报价</th><th>日期</th></tr></thead>
          <tbody>${(x.quotes || []).map(qt => `<tr><td class="num">${esc(qt.artNo)}</td>
            <td class="num">${esc(qt.price)}</td><td class="num">${esc(qt.date)}</td></tr>`).join('')}</tbody>
        </table></div>` : '<div class="empty">暂无报价记录</div>'}
        <div class="sec-title mt">参与项目 · SKU 明细</div>
        ${skuRows.length ? skuRows.map(r => `<div class="file-item" data-act="goto" data-href="#/projects/${r.p.id}" style="cursor:pointer">
          📦 <span class="mono">${esc(r.k.artNo)}</span> ${esc(r.k.name)}
          <span style="margin-left:auto">${r.locked ? '<span class="tag m">FS 锁定</span>' : '<span class="tag b">候选</span>'}
          <span class="tag">${esc(r.p.name)}</span></span></div>`).join('') : '<div class="empty">暂无参与项目</div>'}
      </div>
    </div>`;
  }
  if (pl.kind === 'supAdd' || pl.kind === 'supEdit') {
    const d = pl.draft;
    const isEdit = pl.kind === 'supEdit';
    return `
    <div class="panel-mask" data-act="panel-close"></div>
    <div class="panel">
      <div class="p-head"><h3>${isEdit ? '编辑供应商 · ' + esc(d.name) : '新增供应商'}</h3><button class="x" data-act="panel-close">✕</button></div>
      <div class="p-body">
        ${supForm(d, isEdit)}
        <p class="note-strip">${isEdit ? '信息维护越细，AI 匹配越准——业务员随手更新。' : '供应商名单持续增加、动态维护——保存后立即进入匹配池。'}</p>
      </div>
      <div class="p-foot"><button class="btn ghost" data-act="panel-close">取消</button>
        <button class="btn pri" data-act="${isEdit ? 'sup-edit-save' : 'sup-add-create'}">${isEdit ? '保存修改' : '保存供应商'}</button></div>
    </div>`;
  }
  return '';
}

function supForm(d, full) {
  return `
    <div class="form-row"><label>名称 *</label><input class="ipt" value="${esc(d.name)}" data-chg="sa-name"></div>
    <div class="form-row"><label>品类 *</label><span class="chip-select">
      ${Object.keys(CATS).map(c => `<label class="pick ${d.cats.includes(c) ? 'on' : ''}">
        <input type="checkbox" ${d.cats.includes(c) ? 'checked' : ''} data-chg="sa-cat" data-c="${c}">${CATS[c]}</label>`).join('')}

/* ============================================================
   路由 & 渲染入口
   ============================================================ */

function render() {
  const parts = (location.hash || '#/home').replace(/^#\//, '').split('/');
  let key = parts[0] || 'home';

  // 视角守卫
  if (isClient() && !['projects'].includes(key)) { location.hash = '#/projects'; return; }

  let body = '';
  if (key === 'home') body = viewPlatformHome();
  else if (key === 'dashboard') body = viewDashboard();
  else if (key === 'todos') body = viewTodos();
  else if (key === 'archived') body = viewArchived();
  else if (key === 'orders') body = viewOrders();
  else if (key === 'suppliers') body = viewSuppliers();
  else if (key === 'standards') body = viewStandards();
  else if (key === 'quality') body = viewQuality(parts[1] || 'risk', parts[2] || 'all');
  else if (key === 'clients') body = parts[1] === 'products' ? viewClientProducts()
    : parts[1] === 'sop' ? viewClientSop() : viewClientProfile();
  else if (key === 'projects') {
    const p = parts[1] ? proj(parts[1]) : null;
    if (!p) body = isClient() ? viewClientHome() : viewHome();
    else if (parts[2] === 'node' && parts[3]) {
      if (isClient()) { location.hash = '#/projects/' + p.id; return; }
      const n = nodeOf(p, parts[3]);
      body = n ? viewNode(p, n) : viewHome();
    } else if (parts[2] === 'psf' && parts[3]) {
      if (isClient()) { location.hash = '#/projects/' + p.id; return; }
      const s = skuOf(p, parts[3]);
      body = s ? viewPSF(p, s) : viewHome();
    } else body = isClient() ? viewClientProject(p) : viewProject(p);
  } else body = viewHome();

  $('#app').innerHTML = shell(parts, body) + renderPanel();
  $('#overlay-root').innerHTML = renderOverlay();
}

/* ---------- toast ---------- */
function toast(msg, ok) {
  const el = document.createElement('div');
  el.className = 'toast' + (ok ? ' ok' : '');
  el.textContent = msg;
  $('#toast-root').appendChild(el);
  setTimeout(() => el.remove(), 2400);
}

/* ---------- 上下文取当前路由的项目/节点 ---------- */
function ctx() {
  const parts = (location.hash || '').replace(/^#\//, '').split('/');
  const p = parts[0] === 'projects' && parts[1] ? proj(parts[1]) : null;
  const n = p && parts[2] === 'node' && parts[3] ? nodeOf(p, parts[3]) : null;
  const s = p && parts[2] === 'psf' && parts[3] ? skuOf(p, parts[3]) : null;
  return { p, n, s };
}
function addCmt(n, author, role, text) {
  n.comments.push({ author, role, time: nowStamp(), text });
}
/* ---------- 文件上传 ---------- */
function fmtSize(b) {
  if (!b && b !== 0) return '';
  return b > 1048576 ? (b / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(b / 1024)) + ' KB';
}
function fileIcon(name) {
  const ext = (String(name).split('.').pop() || '').toLowerCase();
  if (['png', 'jpg', 'jpeg', 'gif', 'webp'].includes(ext)) return '🖼️';
  if (ext === 'pdf') return '📕';
  if (['xls', 'xlsx', 'csv'].includes(ext)) return '📊';
  if (['ppt', 'pptx'].includes(ext)) return '📽️';
  if (['ai', 'psd', 'eps'].includes(ext)) return '🎨';
  if (['zip', 'rar', '7z'].includes(ext)) return '🗜️';
  return '📄';
}
function attachFiles(files) {
  const tgt = ui.uploadTarget;
  ui.uploadTarget = null;
  if (!tgt || !files || !files.length) return;
  const list = Array.from(files);
  if (tgt.kind === 'npBrief' && ui.newProj) {
    list.forEach(f => ui.newProj.files.push({ name: f.name, size: f.size }));
    render(); toast(list.length + ' 个 Brief 文件已添加', true);
    return;
  }
  if (tgt.kind === 'skuStep') {
    const pp=proj(tgt.pid),ss=pp&&skuOf(pp,tgt.sid),step=ss&&ss.steps&&ss.steps[tgt.step];
    if (!step) return;
    const by=db.role==='manager'?'管理员':person(PERSONA).name;
    step.inputs=step.inputs||[];
    list.forEach(f=>step.inputs.push({name:f.name,size:f.size,time:TODAY,by}));
    saveDB();render();toast(list.length+' 个文件已上传到 '+tgt.step+' '+nodeDef(tgt.step).name,true);
    return;
  }
  if (tgt.kind === 'orderStep') {
    const order=orderById(tgt.orderId),step=order&&order.steps&&order.steps[tgt.step];
    if(!step)return;
    const by=db.role==='manager'?'管理员':person(PERSONA).name;
    step.inputs=step.inputs||[];
    list.forEach(f=>step.inputs.push({name:f.name,size:f.size,time:TODAY,by}));
    saveDB();render();toast(list.length+' 个文件已上传到 '+nodeDef(tgt.step).name,true);
    return;
  }
  if (tgt.kind === 'node') {
    const pp = proj(tgt.pid), nn = pp && nodeOf(pp, tgt.nid);
    if (!nn) return;
    const by = db.role === 'manager' ? '管理员' : person(PERSONA).name;
    list.forEach(f => nn.inputs.push({ name: f.name, size: f.size, time: TODAY, by }));
    saveDB(); render(); toast(list.length + ' 个文件已上传到节点 ' + tgt.nid, true);
    return;
  }
  if (tgt.kind === 'photo') {
    const pp = proj(tgt.pid);
    if (!pp) return;
    pp.photos = pp.photos || [];
    const remain = 12 - pp.photos.length;
    const imgs = list.filter(f => f.type && f.type.startsWith('image/')).slice(0, Math.max(0, remain));
    if (!imgs.length) { toast('请选择图片文件（每项目最多 12 张）'); return; }
    let done = 0;
    imgs.forEach(f => {
      const rd = new FileReader();
      rd.onload = () => {
        const im = new Image();
        im.onload = () => {
          const cv = document.createElement('canvas');
          const sc = Math.min(1, 320 / im.width);
          cv.width = Math.round(im.width * sc);
          cv.height = Math.round(im.height * sc);
          cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height);
          pp.photos.push({ name: f.name, thumb: cv.toDataURL('image/jpeg', 0.7) });
          if (++done === imgs.length) { saveDB(); render(); toast(done + ' 张样品照片已上传', true); }
        };
        im.src = rd.result;
      };
      rd.readAsDataURL(f);
    });
  }
}

function doSubmitNode(n) {
  ui.submitConfirm = false;
  n.status = 'review';
  addCmt(n, person(n.ownerId).name, '业务', '已提交审批 / 待客户确认。');
  saveDB(); render(); toast('已提交审批');
}

/* ---------- 事件：点击 ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t) return;
  const act = t.dataset.act;
  const { p, n, s } = ctx();

  if (act === 'goto') { location.hash = t.dataset.href; return; }
  if (act === 'home-filter') { ui.homeFilter = t.dataset.f; render(); return; }
  if (act === 'todo-mine') { ui.todoMine = t.dataset.v === '1'; render(); return; }
  if (act === 'bell') {
    ui.todoMine = true; ui.homeFilter = 'overdue';
    if (location.hash === '#/todos') render(); else location.hash = '#/todos';
    return;
  }
  if (act === 'goto-todos') { ui.homeFilter = t.dataset.f || 'all'; location.hash = '#/todos'; return; }
  if (act === 'upload') {
    ui.uploadTarget = t.dataset.kind === 'node' ? { kind: 'node', pid: t.dataset.pid, nid: t.dataset.nid }
      : t.dataset.kind === 'photo' ? { kind: 'photo', pid: t.dataset.pid }
      : { kind: 'npBrief' };
    document.getElementById('fileInput').click();
    return;
  }
  if (act === 'input-del' && n) { n.inputs.splice(+t.dataset.i, 1); saveDB(); render(); return; }
  if (act === 'np-file-del') { ui.newProj.files.splice(+t.dataset.i, 1); render(); return; }
  if (act === 'photo-del' && p) { p.photos.splice(+t.dataset.i, 1); saveDB(); render(); return; }
  if (act === 'gsearch-go') {
    const href = t.dataset.href; ui.searchQ = '';
    if (location.hash === href) render(); else location.hash = href;
    return;
  }
  if (act === 'gsearch-prod') { ui.searchQ = ''; ui.overlay = { kind: 'prod', id: t.dataset.id }; render(); return; }
  if (act === 'np-open') { ui.newProj = { name: '', season: '', delivery: '', owner: PERSONA, standardVersion: 'HEMA-STD-2026.3', skus: [], files: [] }; ui.overlay = { kind: 'newProj' }; render(); return; }
  if (act === 'np-sku-add') { ui.newProj.skus.push({ name: '', cat: 'NB', target: '' }); render(); return; }
  if (act === 'np-sku-del') { ui.newProj.skus.splice(+t.dataset.i, 1); render(); return; }
  if (act === 'np-create') {
    const d = ui.newProj;
    if (!d.name.trim()) { toast('项目名称必填'); return; }
    if (!d.delivery) { toast('请选择交期'); return; }
    if (d.delivery <= TODAY) { toast('交期必须晚于今天（' + TODAY + '）'); return; }
    const pid = 'p' + (db.projects.reduce((m, x) => Math.max(m, parseInt(x.id.slice(1), 10) || 0), 0) + 1);
    const catCount = {};
    db.projects.forEach(pp => pp.skus.forEach(x => { catCount[x.cat] = (catCount[x.cat] || 0) + 1; }));
    const skus = d.skus.filter(x => x.name.trim()).map((x, i) => {
      const cat = x.cat || 'NB';
      catCount[cat] = (catCount[cat] || 0) + 1;
      const target = parseFloat(x.target) || 0;
      return {
        id: pid + 'k' + (i + 1),
        artNo: 'HM-' + cat + '-' + String(catCount[cat]).padStart(3, '0'),
        name: x.name.trim(), cat, ph: CAT_PH[cat] || '📦',
        target, quote: +(target * 1.12).toFixed(2), cost: +(target * 0.78).toFixed(2),
        cand: [], final: null
      };
    });
    const npj = {
      id: pid, name: d.name.trim(), client: 'HEMA', season: d.season.trim() || '—',
      deliveryDate: d.delivery, createdDate: TODAY, ownerId: d.owner, status: 'active', currentNodeId: '01',
      skus,
      nodes: NODE_DEFS.map(x => makeNode(x.id, x.id === '04' ? 'u3' : d.owner, x.id === '04' ? 'u3' : (x.confirm ? 'u5' : null), skus))
    };
    recalcTimeline(npj);
    npj.nodes.forEach(nn => { if (!nn.todos.length) nn.todos = sopOf(nn.id).map(s => ({ t: s.name, done: false })); });
    const n1 = npj.nodes[0];
    n1.status = 'in_progress';
    n1.todos = [{ t: 'SKU 货号建档', done: skus.length > 0 }, { t: '按交期倒推时间线', done: true }, { t: '产品推荐方案', done: false }];
    n1.versions = [{ v: 'V1', time: TODAY, author: person(d.owner).name, note: '建项目，倒推生成 ' + NODE_DEFS.length + ' 节点时间线' }];
    n1.inputs = d.files.map(f => ({ name: f.name, size: f.size, time: TODAY, by: person(d.owner).name }));
    npj.photos = [];
    skus.forEach(x => { db.psfs[x.id] = makePsf(x.id, x.cat, 'V1', false); });
    npj.standardSnapshot = v7DefaultSnapshot();
    npj.standardSnapshot.version = d.standardVersion || 'HEMA-STD-2026.3';
    db.projects.push(npj);
    ui.overlay = null; ui.newProj = null;
    saveDB();
    location.hash = '#/projects/' + pid;
    toast('项目已创建：按交期 ' + d.delivery + ' 倒推生成 14 个节点 deadline', true);
    return;
  }
  if (act === 'reset') { resetDemo(); return; }
  if (act === 'print') { window.print(); return; }
  if (act === 'ovl-close') { ui.overlay = null; render(); return; }
  if (act === 'ovl-close-bg') { if (e.target.classList.contains('ovl')) { ui.overlay = null; render(); } return; }
  if (act === 'panel-close') { ui.panel = null; render(); return; }

  /* 节点状态流转 */
  if (act === 'n-start' && n) { n.status = 'in_progress'; addCmt(n, person(n.ownerId).name, '业务', '节点已开始。'); saveDB(); render(); return; }
  if (act === 'n-submit' && n && p) {
    const tds = n.todos.filter(x => !x.done).length;
    const ms = p.skus.length - doneCount(p, n);
    if (tds || ms) { ui.submitConfirm = true; render(); return; }
    doSubmitNode(n); return;
  }
  if (act === 'n-submit-force' && n) { doSubmitNode(n); return; }
  if (act === 'n-submit-cancel') { ui.submitConfirm = false; render(); return; }
  if (act === 'n-approve' && n) {
    n.status = 'done'; ui.rejectOpen = false;
    addCmt(n, n.reviewerId ? person(n.reviewerId).name : '管理员', '审批', '审批通过。');
    let msg = '审批通过，节点完成';
    if (n.id === '15' && p && p.status === 'active') msg = '收尾节点已完成——可在项目页点「归档项目」正式结项';
    saveDB(); render(); toast(msg, true); return;
  }
  if (act === 'n-reject' && n) { ui.rejectOpen = true; render(); return; }
  if (act === 'n-reject-cancel') { ui.rejectOpen = false; render(); return; }
  if (act === 'n-reject-confirm' && n) {
    const v = ($('#rejectReason') || {}).value || '';
    if (!v.trim()) { toast('驳回原因必填'); return; }
    n.status = 'in_progress'; ui.rejectOpen = false;
    addCmt(n, n.reviewerId ? person(n.reviewerId).name : '管理员', '审批', '【驳回】' + v.trim());
    saveDB(); render(); toast('已驳回，节点退回进行中'); return;
  }
  if (act === 'sku-toggle' && n && p) {
    const k = t.dataset.sku;
    n.skuDone[k] = !n.skuDone[k]; saveDB(); render(); return;
  }
  if (act === 'sku-all' && n && p) {
    p.skus.forEach(x => { n.skuDone[x.id] = true; });
    saveDB(); render(); toast('已将全部 SKU 标记为完成', true); return;
  }
  if (act === 'add-comment' && n) {
    const v = ($('#cmtBox') || {}).value || '';
    if (!v.trim()) return;
    addCmt(n, db.role === 'manager' ? '管理员' : person(n.ownerId).name, db.role === 'manager' ? '管理' : '业务', v.trim());
    saveDB(); render(); return;
  }
  if (act === 'recalc' && p) {
    recalcTimeline(p); saveDB(); render(); toast('已按交期 ' + p.deliveryDate + ' 倒推重算全部节点 deadline', true); return;
  }

  /* PSF */
  if (act === 'psf-lang') { ui.psfLang = t.dataset.l; render(); return; }
  if (act === 'psf-save' && s) {
    const f = db.psfs[s.id];
    const num = f.history.filter(h => h.ver.startsWith('V')).length + 1;
    f.version = 'V' + num;
    f.history.push({ ver: f.version, time: TODAY, author: '业务A', change: '手动保存修订' });
    saveDB(); render(); toast('已保存为 ' + f.version, true); return;
  }
  if (act === 'psf-lock' && s) {
    const f = db.psfs[s.id];
    f.locked = true; f.version = 'Final';
    f.history.push({ ver: 'Final', time: TODAY, author: '业务A', change: '锁定为最终版' });
    saveDB(); render(); toast('已锁定为 Final，编辑器只读', true); return;
  }
  if (act === 'psf-unlock') { ui.psfUnlockOpen = true; render(); return; }
  if (act === 'psf-unlock-cancel') { ui.psfUnlockOpen = false; render(); return; }
  if (act === 'psf-unlock-confirm' && s) {
    const v = ($('#psfReason') || {}).value || '';
    if (!v.trim()) { toast('解锁原因必填'); return; }
    const f = db.psfs[s.id];
    f.locked = false; ui.psfUnlockOpen = false;
    f.history.push({ ver: f.version + '→修订', time: TODAY, author: '业务A', change: '解锁：' + v.trim() });
    saveDB(); render(); toast('已解锁，请修订后重新锁定'); return;
  }
  if (act === 'ovl-import' && p && s) { ui.overlay = { kind: 'import', pid: p.id, skuId: s.id, parsing: false }; render(); return; }
  if (act === 'import-parse') {
    ui.overlay.parsing = true; render();
    setTimeout(() => {
      const o = ui.overlay; if (!o) return;
      const pp = proj(o.pid), ss = skuOf(pp, o.skuId);
      const f = db.psfs[ss.id];
      const tpl = psfTemplate(ss.cat);
      f.sections = { productDesc: tpl.desc, construction: tpl.cons, surface: tpl.surf, packaging: tpl.pack, compliance: tpl.comp };
      f.history.push({ ver: '导入', time: TODAY, author: '业务A', change: '导入客户 PSF 并自动分类（规格 / 包材 / 法规）' });
      ui.overlay = null; saveDB(); render();
      toast('导入完成：已自动分类并生成中文工厂版', true);
    }, 1000);
    return;
  }
  if (act === 'ovl-quote' && p && s) { ui.overlay = { kind: 'quote', pid: p.id, skuId: s.id }; render(); return; }
  if (act === 'ovl-order' && p && s) { ui.overlay = { kind: 'order', pid: p.id, skuId: s.id }; render(); return; }
  if (act === 'ovl-en' && p && s) { ui.overlay = { kind: 'en', pid: p.id, skuId: s.id }; render(); return; }

  /* Tender */
  if (act === 'match-open' && p) { ui.panel = { kind: 'match', pid: p.id, skuId: t.dataset.sku, sel: [...skuOf(p, t.dataset.sku).cand] }; render(); return; }
  if (act === 'match-save' && ui.panel) {
    const pp = proj(ui.panel.pid), ss = skuOf(pp, ui.panel.skuId);
    ss.cand = [...ui.panel.sel];
    ui.panel = null; saveDB(); render(); toast('候选供应商已保存（' + ss.cand.length + ' 家）', true); return;
  }
  if (act === 'ovl-supquotes' && p) { ui.overlay = { kind: 'supquotes', pid: p.id }; render(); return; }
  if (act === 'ovl-ppt' && p) { ui.overlay = { kind: 'ppt', pid: p.id }; render(); return; }

  /* FS */
  if (act === 'fs-lock' && n) {
    n.fsLocked = true;
    n.versions.push({ v: 'Final', time: TODAY, author: person(n.ownerId).name, note: 'FS 锁定为权威版本' });
    saveDB(); render(); toast('FS 已锁定 Final', true); return;
  }
  if (act === 'fs-unlock') { ui.fsUnlockOpen = true; render(); return; }
  if (act === 'fs-unlock-cancel') { ui.fsUnlockOpen = false; render(); return; }
  if (act === 'fs-unlock-confirm' && n) {
    const v = ($('#fsReason') || {}).value || '';
    if (!v.trim()) { toast('解锁原因必填'); return; }
    n.fsLocked = false; ui.fsUnlockOpen = false;
    n.versions.push({ v: '解锁', time: TODAY, author: person(n.ownerId).name, note: '解锁：' + v.trim() });
    saveDB(); render(); toast('FS 已解锁，改动将留痕'); return;
  }

  /* 客户视角 */
  if (act === 'client-confirm' && p) {
    const nn = nodeOf(p, t.dataset.n);
    nn.status = 'done'; addCmt(nn, 'HEMA 买手', '客户', '已确认。');
    saveDB(); render(); toast('已确认，我方将进入下一环节', true); return;
  }
  if (act === 'client-change') { ui.clientChangeFor = ui.clientChangeFor === t.dataset.n ? null : t.dataset.n; render(); return; }
  if (act === 'client-change-send' && p) {
    const v = ($('#ccText') || {}).value || '';
    if (!v.trim()) { toast('请填写修改意见'); return; }
    const nn = nodeOf(p, t.dataset.n);
    nn.status = 'in_progress'; ui.clientChangeFor = null;
    addCmt(nn, 'HEMA 买手', '客户', '【修改意见】' + v.trim());

  }

    const f = db.psfs[s.id];
    const path = t.dataset.path.split('.');
    let obj = f.sections;
    for (let i = 0; i < path.length - 1; i++) obj = obj[path[i]];
    obj[path[path.length - 1]] = t.value;

  }
  if (k === 'fs-final' && p) { skuOf(p, t.dataset.sku).final = t.value || null; saveDB(); render(); return; }

  if (k === 'sa-region') { ui.panel.draft.region = t.value; return; }
  if (k === 'sa-audit') { ui.panel.draft.auditStatus = t.value; return; }
  if (k === 'sa-capacity') { ui.panel.draft.capacity = t.value; return; }
  if (k === 'sa-contact') { ui.panel.draft.contact = t.value; return; }
  if (k === 'sa-years') { ui.panel.draft.yearsCoop = t.value; return; }
  if (k === 'sa-rating') { ui.panel.draft.rating = t.value; return; }

    d.clients = t.checked ? [...d.clients, c] : d.clients.filter(x => x !== c);
    render(); return;

function v7SkuStep(p, s, id) {
  const legacy = nodeOf(p, id);
  const done = legacy && legacy.skuDone && legacy.skuDone[s.id];
  let status = done ? 'done' : (legacy && ['in_progress','review'].includes(legacy.status) ? legacy.status : 'pending');
  return {
    id, status, deadline: legacy ? legacy.deadline : null,
    ownerId: legacy ? legacy.ownerId : p.ownerId,
    reviewerId: legacy ? legacy.reviewerId : null,
    inputs: legacy ? JSON.parse(JSON.stringify(legacy.inputs || [])) : [],
    todos: legacy && legacy.todos && legacy.todos.length ? JSON.parse(JSON.stringify(legacy.todos)) : [{ t: nodeDef(id).name + '资料确认', done }],
    comments: legacy ? JSON.parse(JSON.stringify(legacy.comments || [])) : [],
    versions: legacy ? JSON.parse(JSON.stringify(legacy.versions || [])) : []
  };
}

function v7MakeOrders() {
  const orders = [];
  const poBySupplier = new Map();
  let poSeq = 0;
  const deliveryOffsets = [-1, 4, 12, 28, 2, 0];
  db.projects.forEach((p, pi) => p.skus.forEach((s, si) => {
    if (!s.final) return;
    const poKey = p.id + '|' + s.final;
    if (!poBySupplier.has(poKey)) poBySupplier.set(poKey, 'PO-' + String(2026101 + poSeq++));
    const steps = {};
    ORDER_STEP_IDS.forEach(id => {
      const n = nodeOf(p,id);
      let status = n && n.skuDone && n.skuDone[s.id] ? 'done' : (n && ['in_progress','review'].includes(n.status) ? n.status : 'pending');
      steps[id] = { id, status, ownerId:n ? n.ownerId : p.ownerId, deadline:n ? n.deadline : p.deliveryDate,
        todos:n && n.todos && n.todos.length ? JSON.parse(JSON.stringify(n.todos)) : [{t:nodeDef(id).name + '执行确认',done:status==='done'}],
        inputs:[], comments:[], plannedDate:n ? n.deadline : p.deliveryDate, actualDate:status==='done'?addDays(TODAY,-Math.max(1,16-(+id))):null };
    });
    orders.push({ id:'ord-'+p.id+'-'+s.id, poNo:poBySupplier.get(poKey), projectId:p.id, skuId:s.id,
      supplierId:s.final, qty:3000 + si*500, deliveryDate:addDays(TODAY,deliveryOffsets[orders.length%deliveryOffsets.length]),
      issue:orders.length===2?'待补大货签样':orders.length===5?'出运资料待确认':'', notes:[], steps });
  }));
  return orders;
}

function ensureOrderV8(o,index) {
  const p=proj(o.projectId), s=p&&skuOf(p,o.skuId);
  o.notes=o.notes||[];
  o.issue=o.issue||'';
  o.steps=o.steps||{};
  ORDER_STEP_IDS.forEach(id=>{
    const n=p&&nodeOf(p,id), old=o.steps[id]||{};
    o.steps[id]={
      id,
      status:old.status||'pending',
      ownerId:old.ownerId||(n?n.ownerId:p?p.ownerId:PERSONA),
      deadline:old.deadline||(n?n.deadline:o.deliveryDate),
      plannedDate:old.plannedDate||old.deadline||(n?n.deadline:o.deliveryDate),
      actualDate:old.actualDate||(old.status==='done'?addDays(TODAY,-Math.max(1,11-(+id))):null),
      todos:Array.isArray(old.todos)&&old.todos.length?old.todos:[{t:nodeDef(id).name+'执行确认',done:old.status==='done'}],
      inputs:Array.isArray(old.inputs)?old.inputs:[],
      comments:Array.isArray(old.comments)?old.comments:[]
    };
  });
  if(!o.deliveryDate)o.deliveryDate=p?p.deliveryDate:TODAY;
  if(!o.qty)o.qty=3000+index*500;

function orderForSku(p,s) { return db.orders&&db.orders.find(o=>o.projectId===p.id&&o.skuId===s.id); }
function nextOrderSequence(field,prefix) {
  const nums=(db.orders||[]).map(o=>String(o[field]||'').match(/(\d+)$/)).filter(Boolean).map(m=>+m[1]);
  return prefix+String((nums.length?Math.max(...nums):2026100)+1);
}
function ensureOrderForSku(p,s) {
  let order=orderForSku(p,s);if(order)return order;
  if(!s.final)return null;
  const peer=(db.orders||[]).find(o=>o.projectId===p.id&&o.supplierId===s.final);
  order={id:'ord-'+p.id+'-'+s.id,orderNo:peer?peer.orderNo:nextOrderSequence('orderNo','EL-ORD-'),poNo:peer?peer.poNo:nextOrderSequence('poNo','PO-'),projectId:p.id,skuId:s.id,supplierId:s.final,qty:3000,deliveryDate:p.deliveryDate,issue:'',notes:[],handoffStatus:'draft',createdAt:TODAY,activatedAt:null,steps:{}};
  ensureOrderV8(order,db.orders.length);db.orders.push(order);return order;
}
function activateOrderForSku(p,s) {
  const order=ensureOrderForSku(p,s);if(!order)return null;
  order.handoffStatus='active';order.activatedAt=order.activatedAt||TODAY;return order;
}

function upgradeOrdersV8() {
  if(!Array.isArray(db.orders))db.orders=v7MakeOrders();
  db.orders.forEach(ensureOrderV8);
  if(db.orderSchemaVersion!=='v9-handoff'){
    const poBySupplier=new Map();let poSeq=0;
    const orderNoByGroup=new Map();let orderSeq=0;
    const offsets=[-1,4,12,28,2,0];
    db.orders.forEach((o,i)=>{
      const key=o.projectId+'|'+o.supplierId;
      if(!poBySupplier.has(key))poBySupplier.set(key,'PO-'+String(2026101+poSeq++));
      if(!orderNoByGroup.has(key))orderNoByGroup.set(key,'EL-ORD-'+String(2026101+orderSeq++));
      o.poNo=poBySupplier.get(key);
      o.orderNo=orderNoByGroup.get(key);
      o.deliveryDate=addDays(TODAY,offsets[i%offsets.length]);
      o.createdAt=o.createdAt||addDays(TODAY,-12);
      o.handoffStatus='active';o.activatedAt=o.activatedAt||addDays(TODAY,-5);
      ORDER_STEP_IDS.forEach(id=>{if(!o.steps[id].deadline)o.steps[id].deadline=o.deliveryDate;});
      if(i===2&&!o.issue)o.issue='待补大货签样';
      if(i===5&&!o.issue)o.issue='出运资料待确认';
    });
    const draft=db.orders[db.orders.length-1];
    if(draft){const p=proj(draft.projectId),s=p&&skuOf(p,draft.skuId);draft.handoffStatus='draft';draft.activatedAt=null;draft.issue='';if(s&&s.steps&&s.steps['09']){s.steps['09'].status='review';if(s.steps['09'].todos.length)s.steps['09'].todos[s.steps['09'].todos.length-1].done=false;}}
    db.orderSchemaVersion='v9-handoff';
  }
}

  db.standards = db.standards || v7Standards();

  db.suppliers.forEach((s,i) => {

function skuCurrentStep(s) {
  const first = PRODUCT_STEP_IDS.find(id => s.steps[id].status !== 'done');
  return first || '09';
}
function skuProgress(s) { return PRODUCT_STEP_IDS.filter(id => s.steps[id].status === 'done').length; }
function orderCurrentStep(o) {
  if(o.handoffStatus==='draft')return '10';
  const first = ORDER_STEP_IDS.find(id => orderStepStatus(o,id) !== 'done');
  return first || '15';
}
function orderStepStatus(o,id) {
  if(o.handoffStatus==='draft')return 'pending';
  if (id === '10') return orderAuditAllowed(o) ? 'done' : 'blocked';
  if (id === '11' && !orderAuditAllowed(o)) return 'blocked';
  return o.steps[id].status;
}
function orderAuditGate(o) {
  const s = supplier(o.supplierId);
  return { supplier:s, state:auditState(s) };
}
function orderAuditAllowed(o) { return ['valid','expiring'].includes(orderAuditGate(o).state); }
function statusText(st) { return ({pending:'未开始',in_progress:'进行中',review:'待确认',done:'已完成',blocked:'已阻塞'})[st] || st; }
function v7StatusPill(st) { return `<span class="pill s-${st === 'blocked' ? 'overdue' : st}">${statusText(st)}</span>`; }

function standardRuleNote(kind,text) {
  if(kind==='material') {
    if(text.includes('FSC'))return '适用于纸张与纸板类 SKU；供应商需提供有效证书及材料声明。';
    if(text.includes('PVC'))return '常规产品不得使用；例外情况必须记录原因并取得客户书面确认。';
    return '记录树脂类型、颜色编号、回收属性及对应合规报告。';
  }
  if(kind==='packaging') {
    if(text.includes('条码'))return '在 PO·包材确认环节核对条码、警示语、产地和版面位置。';
    if(text.includes('装箱'))return '装箱数、外箱尺寸和唛头必须与 FS 最终确认版本一致。';
    return '如使用覆膜或塑料包装，需说明材料、必要性及减塑替代方案。';
  }
  if(text.includes('报价前'))return '测试项目、判定方法与费用必须在报价和打样前完成评审。';
  if(text.includes('PSF'))return '结构、材料或工艺风险写入 PSF，并在打样前传达供应商。';
  return '开发样、PP Sample 与大货样结论须绑定对应 SKU、版本和确认记录。';
}

function projectBriefStats(p) {
  ensureProjectV7(p);
  const total=Math.max(1,p.skus.length*PRODUCT_STEP_IDS.length);

  const stages={};p.skus.forEach(s=>{const id=skuCurrentStep(s);stages[id]=(stages[id]||0)+1;});
  const current=Object.entries(stages).sort((a,b)=>b[1]-a[1])[0];
  const deviations=p.skus.reduce((n,s)=>n+s.standardOverrides.filter(o=>o.status!=='已批准').length,0);
  return { progress:Math.round(done/total*100), current:current?nodeDef(current[0]).name:'已完成', deviations, done, total };
}

function orderAlertInfo(o) {
  const gate=orderAuditGate(o),allDone=ORDER_STEP_IDS.every(id=>orderStepStatus(o,id)==='done'),days=diffDays(TODAY,o.deliveryDate);
  if(o.handoffStatus==='draft')return {kind:'issue',label:'待产前样确认'};
  if(!orderAuditAllowed(o))return {kind:'audit',label:'验厂阻塞'};
  if(!allDone&&days<0)return {kind:'overdue',label:`逾期 ${Math.abs(days)} 天`};
  if(o.issue)return {kind:'issue',label:o.issue};
  if(gate.state==='expiring')return {kind:'issue',label:'验厂即将到期'};
  if(!allDone&&days>=0&&days<=7)return {kind:'week',label:days===0?'今日交期':`${days} 天后交期`};
  return {kind:'none',label:'正常'};
}

function supplierProjectRelation(sup,p) {
  const skuRows=[]; const rel=new Set();
  p.skus.forEach(s=>{
    if((s.cand||[]).includes(sup.id)){rel.add('候选');skuRows.push(s);}
    if(s.final===sup.id){rel.add('已选');if(!skuRows.includes(s))skuRows.push(s);}
    if((sup.quotes||[]).some(q=>q.artNo===s.artNo)){rel.add('已报价');if(!skuRows.includes(s))skuRows.push(s);}
  });
  if(skuRows.length&&p.skus.some(s=>s.steps&&['in_progress','review','done'].includes(s.steps['05'].status))) rel.add('已打样');
  if(skuRows.length&&(sup.audits||[]).length) rel.add('验厂关联');
  return { labels:[...rel], skus:skuRows };
}
function supplierLinkedToProject(sup,p) { return supplierProjectRelation(sup,p).labels.length>0; }

function supplierScopedRelation(sup,scopedProject) {
  if(scopedProject)return supplierProjectRelation(sup,scopedProject);
  const labels=new Set(),skus=[];
  db.projects.forEach(p=>{const rel=supplierProjectRelation(sup,p);rel.labels.forEach(x=>labels.add(x));rel.skus.forEach(s=>{if(!skus.includes(s))skus.push(s);});});
  return {labels:[...labels],skus};
}
function supplierRowsForFilter(ignoreAudit=false) {
  const F=ui.supFilter,scopedProject=F.project&&F.project!=='all'?proj(F.project):null,q=(F.q||'').trim().toLowerCase();
  return db.suppliers.filter(s=>{
    const rel=supplierScopedRelation(s,scopedProject);
    const hay=[s.name,s.region,s.categories.map(c=>CATS[c]).join(' '),s.processes.join(' ')].join(' ').toLowerCase();
    return (!scopedProject||rel.labels.length>0)&&(F.relation==='all'||rel.labels.includes(F.relation))&&
      (ignoreAudit||F.audit==='all'||auditState(s)===F.audit)&&(!q||hay.includes(q));
  });
}

render = function() {
  upgradeV7(); upgradeV9();
  const parts=(location.hash||'#/home').replace(/^#\//,'').split('/');
  const key=parts[0]||'home';
  if(isClient()&&!['projects'].includes(key)){location.hash='#/projects';return;}
  let body='';
  if(key==='home') body=viewPlatformHome();
  else if(key==='dashboard') body=viewDashboard();
  else if(key==='todos') body=viewTodos();
  else if(key==='archived') body=viewArchived();
  else if(key==='orders') {
    const o=parts[1]?orderById(parts[1]):null;
    body=o&&parts[2]==='step'?viewOrderDetail(o,parts[3]):viewOrders();
  }
  else if(key==='suppliers') {
    if(parts[1]==='project') body=viewSuppliersV7(parts[2]||'all');
    else { const sup=parts[1]?supplier(parts[1]):null; body=sup?viewSupplierDetailV7(sup,parts[2]||'basic'):viewSuppliersV7('all'); }
  }
  else if(key==='standards') body=viewStandardsV7(parts[1]||'brand',parts[2]||ui.standardDocId);
  else if(key==='quality') body=viewQuality(parts[1]||'risk',parts[2]||'all');
  else if(key==='clients') body=parts[1]==='products'?viewClientProducts():parts[1]==='sop'?viewClientSop():viewClientProfile();
  else if(key==='projects') {
    const p=parts[1]?proj(parts[1]):null;
    if(!p) body=isClient()?viewClientHomeV7():viewHome();
    else if(parts[2]==='sku'&&parts[3]) {
      const s=skuOf(p,parts[3]);
      if(isClient()) body=viewClientProjectV7(p);
      else if(!s) body=viewProject(p);
      else if(parts[4]==='step') body=viewSkuStep(p,s,parts[5]);
      else body=viewSkuStep(p,s,skuCurrentStep(s));
    }
    else if(parts[2]==='node'&&parts[3]) {
      const first=p.skus[0]; body=PRODUCT_STEP_IDS.includes(parts[3])?viewSkuStep(p,first,parts[3]):viewProject(p);
    }
    else if(parts[2]==='psf'&&parts[3]) { const s=skuOf(p,parts[3]); body=s?viewPSF(p,s):viewProject(p); }
    else body=isClient()?viewClientProjectV7(p):viewProject(p);
  } else body=viewHome();
  $('#app').innerHTML=shell(parts,body)+renderPanel();
  $('#overlay-root').innerHTML=renderOverlay();
};

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-v7act]'); if(!t)return; const act=t.dataset.v7act;
  if(act==='toggle-user-menu'){ui.userMenuOpen=!ui.userMenuOpen;render();return;}
  if(act==='user-account'){ui.userMenuOpen=false;render();toast('当前为业务A · HEMA 内部业务视角',true);return;}
  if(act==='user-todos'){ui.userMenuOpen=false;location.hash='#/todos';return;}
  if(act==='user-logout'){ui.userMenuOpen=false;render();toast('离线 Demo 未连接真实账号，已保持当前演示身份');return;}
  if(act==='product-category'){ui.skuFilter.cat=t.dataset.cat;render();return;}
  if(act==='product-nav-all'){
    ui.skuFilter.project='all';
    const parts=(location.hash||'').replace(/^#\//,'').split('/');
    if(parts[0]==='projects'&&parts[1])location.hash='#/projects';else render();
    return;
  }
  if(act==='toggle-product-project'){
    const pid=t.dataset.project;ui.productNavCollapsed[pid]=!ui.productNavCollapsed[pid];render();return;
  }
  if(act==='detail-category'){
    const p=proj(t.dataset.project),cat=t.dataset.cat,step=t.dataset.step;
    if(!p)return;ui.skuFilter.project=p.id;ui.skuFilter.cat=cat;ui.skuFilter.step=step;
    if(cat==='all'){location.hash='#/projects';return;}
    const next=p.skus.find(x=>x.cat===cat);if(next)location.hash=`#/projects/${p.id}/sku/${next.id}/step/${step}`;
    return;
  }
  if(act==='project-overview'){
    const pid=t.dataset.project||(ui.skuFilter.project!=='all'?ui.skuFilter.project:'');
    if(pid)location.hash=`#/projects/${pid}`;else toast('请先选择一个项目');
    return;
  }
  if(act==='sku-upload'){
    ui.uploadTarget={kind:'skuStep',pid:t.dataset.project,sid:t.dataset.sku,step:t.dataset.step};
    document.getElementById('fileInput').click();return;
  }
  if(act==='order-upload'){
    ui.uploadTarget={kind:'orderStep',orderId:t.dataset.order,step:t.dataset.step};
    document.getElementById('fileInput').click();return;
  }
  if(act==='toggle-order-tree'){
    const key=t.dataset.key;ui.orderNavCollapsed[key]=!ui.orderNavCollapsed[key];persistOrderUi();render();return;
  }
  if(act==='toggle-order-mobile'){ui.orderMobileNav=!ui.orderMobileNav;render();return;}

/* ---------- 工作日与自动倒计时 ---------- */
function workdaysBetween(from, to) {
  if (!from || !to) return 0;
  let a = new Date(from + 'T00:00:00'), b = new Date(to + 'T00:00:00'), sign = 1, n = 0;
  if (a > b) { const t = a; a = b; b = t; sign = -1; }
  while (a < b) { a.setDate(a.getDate() + 1); const w = a.getDay(); if (w !== 0 && w !== 6) n++; }
  return n * sign;
}
function countdownStrip(st) {
  if (!st || !st.deadline) return '';
  const left = workdaysBetween(TODAY, st.deadline);
  const used = st.startedAt ? workdaysBetween(st.startedAt, TODAY) : 0;
  const cls = left < 0 ? 'v9-cd over' : left <= 2 ? 'v9-cd warn' : 'v9-cd';
  return `<div class="${cls}"><b>自动倒计时</b>
    <span>已计时 <b>${used}</b> 个工作日</span>
    <span>${left < 0 ? `逾期 <b>${-left}</b> 个工作日` : `剩余 <b>${left}</b> 个工作日`}</span>
    <span>截止 ${esc(st.deadline)}</span></div>`;
}

/* ---------- 交期倒推：同步写回 SKU 步骤与订单 ---------- */
function recalcAllDeadlines(p) {
  const D = recalcTimeline(p);
  (p.skus || []).forEach(s => PRODUCT_STEP_IDS.forEach(id => { if (s.steps && s.steps[id]) s.steps[id].deadline = D[id]; }));
  (db.orders || []).filter(o => o.projectId === p.id).forEach(o => ORDER_STEP_IDS.forEach(id => {
    if (o.steps && o.steps[id]) { o.steps[id].deadline = D[id]; o.steps[id].plannedDate = D[id]; }
  }));
  return D;
}

    <div class="tbl-wrap"><table class="tbl"><thead><tr><th>货号</th><th>品名</th><th>指定工厂</th></tr></thead>
      <tbody>${rows.map(s => `<tr><td class="num">${esc(s.artNo)}</td><td>${esc(s.name)}</td>
        <td><span class="tag b">${esc(supplier(s.final).name)}</span></td></tr>`).join('')}</tbody></table></div>
  </section>`;
}

/* ---------- 标准中心二级入口（不新增一级导航） ---------- */
function v9StandardExtras() {
  return `<div class="v9-extras">
    <a class="v9-extra" href="#/clients/profile"><b>客户品牌档案</b><span>品牌定位、色彩与材料资产库、标准与偏好</span></a>
    <a class="v9-extra" href="#/clients/products"><b>过往产品库</b><span>按年份 / 项目归档，老品规格可检索、可复用</span></a>
    <a class="v9-extra" href="#/archived"><b>已归档项目</b><span>结项资料与项目复盘记录</span></a>
  </div>`;
}

/* ---------- V9 数据升级（幂等） ---------- */
function upgradeV9() {
  if (ui.v9Reject === undefined) ui.v9Reject = null;
  if (ui.v9FsUnlock === undefined) ui.v9FsUnlock = false;
  if (ui.briefFilter === undefined) ui.briefFilter = '';
  db.projects.forEach(p => {
    if (p.fsLocked === undefined) p.fsLocked = false;
    if (!p.fsVersions) p.fsVersions = [];
    (p.skus || []).forEach(s => {
      if (!s.qualityDocs) s.qualityDocs = { QBP: true, PPA: !!s.final, MSDS: !!s.final, HSCC: false };
      if (!s.benchmark) s.benchmark = { owner: s.final ? '我方' : '待定' };
      PRODUCT_STEP_IDS.forEach(id => {
        const st = s.steps && s.steps[id]; if (!st) return;
        if (!st.comments) st.comments = [];
        if (st.startedAt === undefined) st.startedAt = ['in_progress', 'review', 'done'].includes(st.status) ? addDays(TODAY, -3) : null;
      });
    });
  });
  (db.orders || []).forEach(o => ORDER_STEP_IDS.forEach(id => {
    const st = o.steps && o.steps[id]; if (st && !st.comments) st.comments = [];
  }));
  if (db.workflowSchemaVersion !== 'v9') { db.workflowSchemaVersion = 'v9'; saveDB(); }
}

/* ---------- V9 事件 ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-v9act]'); if (!t) return;
  const act = t.dataset.v9act;
  const p = t.dataset.project ? proj(t.dataset.project) : null;
  const s = p && t.dataset.sku ? skuOf(p, t.dataset.sku) : null;
  const st = s && t.dataset.step ? s.steps[t.dataset.step] : null;

  if (act === 'recalc' && p) {
    recalcAllDeadlines(p); saveDB(); render();
    toast('已按交期 ' + p.deliveryDate + ' 倒推重算全部环节 deadline', true); return;
  }
  if (act === 'goto-step') {
    ui.skuFilter.project = t.dataset.project; ui.skuFilter.step = t.dataset.step;
    ui.skuFilter.cat = 'all'; ui.skuFilter.status = 'all';
    if (location.hash === '#/projects') render(); else location.hash = '#/projects';
    return;
  }
  if (act === 'add-comment') {
    const box = document.getElementById(t.dataset.box), text = box ? box.value.trim() : '';
    if (!text) { toast('请输入内容'); return; }
    let target = null;
    if (t.dataset.kind === 'order') { const o = orderById(t.dataset.order); target = o && o.steps[t.dataset.step]; }
    else target = st;
    if (!target) return;
    addStepCmt(target, v9Actor(), v9ActorRole(), text);
    saveDB(); render(); toast('已写入审批记录', true); return;
  }
  if (act === 'approve-sku' && st) {
    st.status = 'done'; st.todos.forEach(x => x.done = true);
    st.versions.push({ v: 'V' + (st.versions.length + 1), time: TODAY, author: v9Actor(), note: '已确认通过' });
    addStepCmt(st, v9Actor(), v9ActorRole(), '确认通过，进入下一环节。');
    if (t.dataset.step === '09') activateOrderForSku(p, s);
    ui.v9Reject = null; saveDB(); render();
    toast(s.artNo + ' · ' + t.dataset.step + ' 已确认通过', true); return;
  }
  if (act === 'reject-open') {
    ui.v9Reject = { pid: t.dataset.project, sid: t.dataset.sku, step: t.dataset.step }; render(); return;
  }
  if (act === 'reject-cancel') { ui.v9Reject = null; render(); return; }
  if (act === 'reject-confirm' && st) {
    const box = document.getElementById('v9RejectReason'), v = box ? box.value.trim() : '';
    if (!v) { toast('修改意见必填'); return; }
    st.status = 'in_progress';
    st.versions.push({ v: 'V' + (st.versions.length + 1), time: TODAY, author: v9Actor(), note: '驳回：' + v });
    addStepCmt(st, v9Actor(), v9ActorRole(), v);
    ui.v9Reject = null; saveDB(); render(); toast('修改意见已回填，环节退回进行中'); return;
  }
  if (act === 'reopen-sku' && st) {
    st.status = 'in_progress';
    st.versions.push({ v: 'V' + (st.versions.length + 1), time: TODAY, author: v9Actor(), note: '重新打开' });
    saveDB(); render(); toast('环节已重新打开'); return;
  }
  if (act === 'bm-owner' && s) {
    s.benchmark = s.benchmark || {}; s.benchmark.owner = t.dataset.owner;
    saveDB(); render(); toast(s.artNo + ' 定款归属：' + t.dataset.owner, true); return;
  }
  if (act === 'fs-lock' && p) {
    p.fsLocked = true; p.fsVersions = p.fsVersions || [];
    p.fsVersions.push({ v: 'Final', time: TODAY, author: v9Actor(), note: 'FS 锁定为权威版本' });
    saveDB(); render(); toast('FS 已锁定 Final', true); return;
  }
  if (act === 'fs-unlock') { ui.v9FsUnlock = true; render(); return; }
  if (act === 'fs-unlock-cancel') { ui.v9FsUnlock = false; render(); return; }
  if (act === 'fs-unlock-confirm' && p) {
    const box = document.getElementById('v9FsReason'), v = box ? box.value.trim() : '';
    if (!v) { toast('解锁原因必填'); return; }
    p.fsLocked = false; ui.v9FsUnlock = false;
    p.fsVersions.push({ v: '解锁', time: TODAY, author: v9Actor(), note: '解锁：' + v });
    saveDB(); render(); toast('FS 已解锁，改动将留痕'); return;
  }
  if (act === 'save-review' && p) {
    const box = document.getElementById('v9ReviewBox'), v = box ? box.value.trim() : '';
    if (!v) { toast('请填写复盘要点'); return; }
    p.review = { text: v, by: v9Actor(), time: TODAY };
    p.status = 'archived';
    saveDB(); render(); toast('复盘已保存，项目已归档并进入过往产品库', true); return;
  }
});

document.addEventListener('change', e => {
  const t = e.target.closest('[data-v9chg]'); if (!t) return;
  const k = t.dataset.v9chg, p = proj(t.dataset.project), s = p && skuOf(p, t.dataset.sku);
  if (!s) return;
  if (k === 'quality-doc') {
    s.qualityDocs = s.qualityDocs || {}; s.qualityDocs[t.dataset.key] = t.checked;
    saveDB(); render(); return;
  }
  if (k === 'fs-final') {
    s.final = t.value || null;
    if (s.final && s.benchmark && s.benchmark.owner === '待定') s.benchmark.owner = '我方';
    saveDB(); render(); toast(s.artNo + ' 最终供应商已更新', true); return;
  }
});

document.addEventListener('input', e => {
  const t = e.target.closest('[data-v9input]'); if (!t) return;
  const k = t.dataset.v9input, v = t.value, pos = t.selectionStart;
  if (k === 'brief-filter') ui.briefFilter = v; else return;
  render();
  const nt = document.querySelector(`[data-v9input="${k}"]`);
  if (nt) { nt.focus(); try { nt.setSelectionRange(pos, pos); } catch (err) { /* ignore */ } }
});

/* ---------- 初始化 ---------- */
loadDB();
const fileInputEl = document.getElementById('fileInput');
if (fileInputEl) fileInputEl.addEventListener('change', () => { attachFiles(fileInputEl.files); fileInputEl.value = ''; });
window.addEventListener('hashchange', () => { ui.rejectOpen = false; ui.fsUnlockOpen = false; ui.psfUnlockOpen = false; ui.submitConfirm = false; ui.searchQ = ''; ui.clientEdit = false; ui.userMenuOpen = false; render(); });
render();
</script>
</body>
