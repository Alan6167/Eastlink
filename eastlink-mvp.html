<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eastlink MVP</title>
<style>
:root {
  --bg: #F5F8FD;
  --surface: #FFFFFF;
  --surface-2: #EDF3FC;
  --ink: #0D1E3A;
  --muted: #51648A;
  --line: #D9E3F3;
  --line-dash: #C7D5EC;
  --brand: #0567FF;
  --brand-ink: #0356DB;
  --brand-soft: #E3EDFF;
  --sky: #57BEEF;
  --sky-soft: #E3F4FD;
  --sky-text: #0C6DA6;
  --mint: #3CD68B;
  --mint-soft: #DFF8EB;
  --mint-text: #0C7A4A;
  --red: #E5484D;
  --red-soft: #FDEBEC;
  --amber: #F5A524;
  --amber-soft: #FDF3DF;
  --shadow: 0 1px 2px rgba(13,30,58,.05), 0 8px 22px -12px rgba(13,30,58,.13);
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 400 14px/1.65 -apple-system, "SF Pro SC", "PingFang SC", "Hiragino Sans GB", "Source Han Sans SC", "Noto Sans CJK SC", "Microsoft YaHei", system-ui, sans-serif;
}
a { color: var(--brand-ink); text-decoration: none; }
button { font: inherit; cursor: pointer; }
input, select, textarea { font: inherit; color: var(--ink); }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 1px; border-radius: 4px; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* ---------- shell: sidebar + main ---------- */
.shell { display: flex; min-height: 100vh; }
.sidebar {
  flex: 0 0 210px;
  position: sticky;
  top: 0;
  height: 100vh;
  background: linear-gradient(165deg, #0567FF 0%, #0349BC 100%);
  color: #fff;
  display: flex;
  flex-direction: column;
  padding: 16px 12px 14px;
  z-index: 40;
}
.side-brand {
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 800;
  font-size: 16px;
  letter-spacing: .02em;
  padding: 0 8px 14px;
  margin-bottom: 8px;
  border-bottom: 1px solid rgba(255,255,255,.16);
}
.logo-tag { font: 650 9.5px/1 var(--mono); letter-spacing: .1em; background: rgba(255,255,255,.18); border-radius: 999px; padding: 4px 7px; }
.side-nav { display: flex; flex-direction: column; gap: 2px; }
.side-nav a {
  position: relative;
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 9px 11px;
  border-radius: 9px;
  color: rgba(255,255,255,.82);
  font-size: 13.5px;
  font-weight: 550;
}
.side-nav a svg { flex: 0 0 16px; width: 16px; height: 16px; opacity: .9; }
.side-nav a:hover { background: rgba(255,255,255,.12); color: #fff; text-decoration: none; }
.side-nav a.on { background: rgba(255,255,255,.18); color: #fff; font-weight: 700; }
.side-nav a.on::before {
  content: "";
  position: absolute;
  left: -12px;
  top: 50%;
  transform: translateY(-50%);
  width: 3px;
  height: 18px;
  border-radius: 0 3px 3px 0;
  background: #fff;
}
.side-nav a.on svg { opacity: 1; }
.side-foot { margin-top: auto; padding-top: 12px; }
.btn-reset {
  width: 100%;
  background: transparent;
  color: rgba(255,255,255,.85);
  border: 1px solid rgba(255,255,255,.3);
  border-radius: 8px;
  padding: 7px 10px;
  font-size: 12.5px;
}
.btn-reset:hover { background: rgba(255,255,255,.12); }
.main { flex: 1; min-width: 0; }
.mainbar {
  position: sticky;
  top: 0;
  z-index: 30;
  height: 50px;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 24px;
}
.mainbar .spacer { flex: 1; }
.mainbar select {
  background: #fff;
  color: var(--ink);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 5px 8px;
  font-size: 12.5px;
}
.mainbar select:hover { border-color: var(--brand); }
.role-badge {
  font-size: 12px;
  font-weight: 650;
  border-radius: 999px;
  padding: 4px 10px;
  background: var(--brand-soft);
  color: var(--brand-ink);
}
.role-badge.r-client { background: var(--sky-soft); color: var(--sky-text); }
.role-badge.r-manager { background: var(--mint-soft); color: var(--mint-text); }
.mainbar .today { font-size: 12px; color: var(--muted); }

/* ---------- layout ---------- */
.view { max-width: 1180px; margin: 0 auto; padding: 22px 24px 80px; }
.page-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px 16px; margin-bottom: 16px; }
.page-head h1 { margin: 0; font-size: 21px; font-weight: 750; letter-spacing: .01em; }
.page-head .sub { color: var(--muted); font-size: 13px; }
.page-head .spacer { flex: 1; }
.crumb { font-size: 12.5px; color: var(--muted); margin-bottom: 6px; }
.crumb a { color: var(--muted); }
.crumb a:hover { color: var(--brand-ink); }
.crumb b { color: var(--ink); font-weight: 600; }

/* ---------- cards & stats ---------- */
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 13px;
  padding: 16px 18px;
  box-shadow: var(--shadow);
}
.card h3 { margin: 0 0 10px; font-size: 14.5px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.grid { display: grid; gap: 13px; }
.g4 { grid-template-columns: repeat(4, 1fr); }
.g3 { grid-template-columns: repeat(3, 1fr); }
.g2 { grid-template-columns: 1fr 1fr; }
.mt { margin-top: 14px; }
.statcard { padding: 14px 16px; }
.statcard .num { font: 750 26px/1.15 var(--mono); letter-spacing: -.01em; }
.statcard .lbl { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
.statcard.warn .num { color: var(--red); }
.statcard.brand .num { color: var(--brand-ink); }
.statcard.mint .num { color: var(--mint-text); }

/* ---------- pills / chips / badges ---------- */
.pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 11.5px;
  font-weight: 650;
  border-radius: 999px;
  padding: 3px 9px;
  white-space: nowrap;
}
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.s-pending { background: var(--surface-2); color: var(--muted); }
.pill.s-in_progress { background: var(--brand-soft); color: var(--brand-ink); }
.pill.s-review { background: var(--amber-soft); color: #9A6A0B; }
.pill.s-done { background: var(--mint-soft); color: var(--mint-text); }
.pill.s-overdue { background: var(--red-soft); color: var(--red); }
.tag {
  display: inline-block;
  font-size: 11px;
  font-weight: 600;
  border-radius: 6px;
  padding: 2.5px 7px;
  background: var(--surface-2);
  color: var(--muted);
  white-space: nowrap;
}
.tag.b { background: var(--brand-soft); color: var(--brand-ink); }
.tag.k { background: var(--sky-soft); color: var(--sky-text); }
.tag.m { background: var(--mint-soft); color: var(--mint-text); }
.tag.r { background: var(--red-soft); color: var(--red); }
.tag.a { background: var(--amber-soft); color: #9A6A0B; }
.avatar {
  display: inline-grid;
  place-items: center;
  width: 22px;
  height: 22px;
  border-radius: 7px;
  background: var(--brand-soft);
  color: var(--brand-ink);
  font-size: 11px;
  font-weight: 750;
  vertical-align: -5px;
  margin-right: 5px;
}
.who { display: inline-flex; align-items: center; font-size: 12.5px; color: var(--ink); font-weight: 550; margin-right: 10px; }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border-radius: 9px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  font-size: 12.5px;
  font-weight: 600;
  padding: 6px 12px;
}
.btn:hover { border-color: var(--brand); color: var(--brand-ink); }
.btn.pri { background: var(--brand); border-color: var(--brand); color: #fff; }
.btn.pri:hover { background: var(--brand-ink); color: #fff; }
.btn.mint { background: var(--mint-soft); border-color: var(--mint); color: var(--mint-text); }
.btn.danger { background: var(--red-soft); border-color: transparent; color: var(--red); }
.btn.ghost { background: transparent; }
.btn.sm { padding: 3.5px 9px; font-size: 12px; border-radius: 7px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; pointer-events: none; }
.btnrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

/* ---------- tables ---------- */
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 11px; background: var(--surface); }
table.tbl { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 640px; }
.tbl th {
  text-align: left;
  font-size: 11.5px;
  font-weight: 650;
  letter-spacing: .04em;
  color: var(--muted);
  background: var(--surface-2);
  padding: 8px 12px;
  white-space: nowrap;
}
.tbl td { padding: 9px 12px; border-top: 1px solid var(--line); vertical-align: top; }
.tbl tr:hover td { background: #FAFCFF; }
.tbl .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.tbl input, .tbl select { max-width: 160px; }

/* ---------- forms ---------- */
input.ipt, select.ipt, textarea.ipt {
  width: 100%;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 6px 9px;
  font-size: 13px;
  background: #fff;
}
textarea.ipt { resize: vertical; min-height: 60px; }
input.ipt:focus, textarea.ipt:focus, select.ipt:focus { border-color: var(--brand); outline: none; }
.ipt-inline { width: auto; }
.filterbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 13px; }
.filterbar .ipt { width: auto; min-width: 130px; }
.filterbar .search { min-width: 200px; }

/* ---------- project card ---------- */
.proj-card { cursor: pointer; transition: border-color .15s ease; }
.proj-card:hover { border-color: var(--brand); }
.proj-card .top { display: flex; align-items: baseline; gap: 10px; }
.proj-card .name { font-size: 15.5px; font-weight: 750; }
.proj-card .meta { color: var(--muted); font-size: 12.5px; margin: 6px 0 10px; display: flex; flex-wrap: wrap; gap: 4px 14px; }
.mini-flow { display: flex; gap: 3px; }
.mini-flow i {
  height: 8px;
  flex: 1;
  border-radius: 3px;
}
/* 通用进度段配色（.mini-flow i 与 .seg 共用）——各状态类特异性保持一致，
   故容器不设默认 background，未开始由 .f-pending 显式着色 */
.f-pending { background: var(--line); }
.f-done { background: var(--mint); }
.f-in_progress { background: var(--brand); }
.f-review { background: var(--amber); }
.f-overdue { background: var(--red); }

/* ---------- home: 统计卡筛选 / 风险条 / 项目行 ---------- */
.statcard.click { cursor: pointer; transition: border-color .15s ease; }
.statcard.click:hover { border-color: var(--brand); }
.statcard.on { border-color: var(--brand); box-shadow: 0 0 0 1px var(--brand), var(--shadow); }
.statcard .hint { font-size: 11px; color: var(--muted); margin-top: 4px; }
.riskbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px 12px;
  background: var(--red-soft);
  color: var(--red);
  border-radius: 11px;
  padding: 11px 15px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
}
.riskbar .go { margin-left: auto; font-size: 12.5px; font-weight: 650; }
.riskbar .cool { color: #8A3B3E; font-weight: 500; }
.prow { cursor: pointer; transition: border-color .15s ease; }
.prow:hover { border-color: var(--brand); }
.prow-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px; }
.prow-head .name { font-size: 16px; font-weight: 750; }
.prow-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 20px;
  color: var(--muted);
  font-size: 12.5px;
  margin: 9px 0 12px;
}
.prow-meta b { color: var(--ink); font-family: var(--mono); font-weight: 650; }
.prow-meta b.over { color: var(--red); }
.flowbar { display: flex; gap: 10px; align-items: flex-end; }
.flowbar .grp { display: flex; gap: 3px; }
.flowbar .grp.g-dev { flex: 7; }
.flowbar .grp.g-pre { flex: 3; }
.flowbar .grp.g-end { flex: 4; }
.seg {
  position: relative;
  flex: 1;
  height: 10px;
  border-radius: 3px;
  cursor: pointer;
  transition: transform .12s ease;
}
.seg:hover { transform: scaleY(1.5); }
.seg.cur {
  height: 16px;
  box-shadow: 0 0 0 2px var(--surface), 0 0 0 3.5px var(--brand);
}
.flow-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 8px;
  align-items: center;
  margin-top: 11px;
  font-size: 12.5px;
  color: var(--muted);
}
.flow-legend b { color: var(--ink); }
.phase-ticks {
  display: flex;
  gap: 10px;
  margin-top: 5px;
  font: 550 9.5px/1 var(--mono);
  letter-spacing: .1em;
  color: var(--muted);
  text-transform: uppercase;
}
.phase-ticks span.g-dev { flex: 7; }
.phase-ticks span.g-pre { flex: 3; }
.phase-ticks span.g-end { flex: 4; }
.todo-head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 4px; }
.todo-head .tabs { margin: 0 0 0 auto; border: 0; }
.todo-head .tabs button { padding: 5px 11px; font-size: 12.5px; }

/* ---------- todo list ---------- */
.todo-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 4px;
  border-top: 1px dashed var(--line-dash);
  cursor: pointer;
  font-size: 13px;
}
.todo-item:first-of-type { border-top: 0; }
.todo-item:hover .t-name { color: var(--brand-ink); }
.todo-item .t-name { font-weight: 600; }
.todo-item .t-proj { color: var(--muted); font-size: 12px; }
.todo-item .t-dl { margin-left: auto; font-family: var(--mono); font-size: 12px; color: var(--muted); white-space: nowrap; }
.todo-item .t-dl.over { color: var(--red); font-weight: 700; }

/* ---------- workflow lanes ---------- */
.lanes { display: grid; gap: 0; }
.lane { padding: 12px 0; }
.lane + .lane { border-top: 1px dashed var(--line-dash); }
.lane-tag { display: flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 700; margin-bottom: 9px; }
.lane-tag i { width: 10px; height: 10px; border-radius: 2.5px; }
.lane-tag span { font: 550 10px/1 var(--mono); letter-spacing: .1em; color: var(--muted); text-transform: uppercase; }
.lane.ph-dev .lane-tag i { background: var(--brand); }
.lane.ph-pre .lane-tag i { background: var(--sky); }
.lane.ph-end .lane-tag i { background: var(--mint); }
.lane-chips { display: flex; flex-wrap: wrap; gap: 8px 6px; align-items: stretch; }
.nchip {
  display: flex;
  flex-direction: column;
  gap: 3px;
  min-width: 118px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--surface-2);
  padding: 7px 10px;
  cursor: pointer;
  transition: border-color .15s ease;
}
.nchip:hover { border-color: var(--brand); }
.nchip.cur { border-color: var(--brand); box-shadow: 0 0 0 1px var(--brand); background: var(--brand-soft); }
.nchip.disabled { cursor: default; }
.nchip.disabled:hover { border-color: var(--line); }
.nchip .l1 { display: flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 700; }
.nchip .no {
  display: inline-grid;
  place-items: center;
  width: 19px;
  height: 19px;
  border-radius: 5px;
  color: #fff;
  font: 700 10px/1 var(--mono);
}
.ph-dev .nchip .no { background: var(--brand); }
.ph-pre .nchip .no { background: var(--sky); color: #08405F; }
.ph-end .nchip .no { background: var(--mint); color: #06331F; }
.nchip .l2 { display: flex; align-items: center; gap: 6px; font-size: 10.5px; color: var(--muted); font-family: var(--mono); }
.dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
.dot.s-pending { background: var(--line-dash); }
.dot.s-in_progress { background: var(--brand); }
.dot.s-review { background: var(--amber); }
.dot.s-done { background: var(--mint); }
.nchip .over { color: var(--red); font-weight: 700; }
.hintbar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 14px;
  align-items: center;
  background: var(--brand-soft);
  border-radius: 10px;
  padding: 10px 14px;
  font-size: 13px;
  margin-top: 13px;
}
.hintbar b { color: var(--brand-ink); }
.hintbar.warn { background: var(--red-soft); }
.hintbar.warn b { color: var(--red); }

/* ---------- node detail ---------- */
.node-headcard { display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: center; }
.node-headcard .big { font-size: 18px; font-weight: 750; display: flex; align-items: center; gap: 10px; }
.node-headcard .code { font: 700 12px/1 var(--mono); letter-spacing: .1em; color: var(--brand-ink); text-transform: uppercase; }
.kv { font-size: 12.5px; color: var(--muted); }
.kv b { color: var(--ink); font-family: var(--mono); font-weight: 650; }
.kv b.over { color: var(--red); }
.sec-title {
  font-size: 11.5px;
  font-weight: 700;
  letter-spacing: .08em;
  color: var(--muted);
  text-transform: uppercase;
  margin: 0 0 8px;
  font-family: var(--mono);
}
.file-item {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12.5px;
  padding: 6px 9px;
  border: 1px dashed var(--line-dash);
  border-radius: 8px;
  color: var(--muted);
  margin-bottom: 6px;
}
.chk { display: flex; align-items: flex-start; gap: 8px; padding: 5px 0; font-size: 13px; cursor: pointer; }
.chk input { margin-top: 3px; accent-color: var(--brand); }
.chk.done span { color: var(--muted); text-decoration: line-through; }
.cmt { border-top: 1px dashed var(--line-dash); padding: 9px 0; font-size: 13px; }
.cmt:first-of-type { border-top: 0; }
.cmt .h { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
.cmt .t { color: var(--muted); font-size: 11px; font-family: var(--mono); margin-left: auto; }
.cmt p { margin: 0; color: #3E4F6E; }
.ver { display: flex; gap: 10px; align-items: baseline; padding: 7px 0; border-top: 1px dashed var(--line-dash); font-size: 12.5px; }
.ver:first-of-type { border-top: 0; }
.ver .v { font: 700 11px/1.6 var(--mono); color: var(--brand-ink); min-width: 42px; }
.ver .d { color: var(--muted); font-family: var(--mono); font-size: 11px; margin-left: auto; white-space: nowrap; }
.reject-box { margin-top: 8px; }

/* ---------- psf ---------- */
.psf-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 13px; }
.lang-toggle { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
.lang-toggle button { border: 0; background: var(--surface); padding: 5px 13px; font-size: 12.5px; font-weight: 650; color: var(--muted); }
.lang-toggle button.on { background: var(--brand); color: #fff; }
.psf-sec { margin-top: 14px; }
.psf-sec .tbl td input.cell {
  width: 100%;
  border: 1px solid transparent;
  background: transparent;
  border-radius: 6px;
  padding: 3px 6px;
  font-size: 13px;
}
.psf-sec .tbl td input.cell:hover { border-color: var(--line); background: #fff; }
.psf-sec .tbl td input.cell:focus { border-color: var(--brand); background: #fff; outline: none; }
.psf-sec .tbl td input.cell[disabled] { color: var(--ink); opacity: 1; }
tr.critical td { background: var(--red-soft) !important; }
tr.critical td:first-child { border-left: 3px solid var(--red); }
.badge-final {
  background: var(--mint);
  color: #06331F;
  font: 750 10.5px/1 var(--mono);
  letter-spacing: .08em;
  border-radius: 999px;
  padding: 5px 10px;
}
.badge-lock { background: var(--surface-2); color: var(--muted); font-size: 11.5px; border-radius: 999px; padding: 4px 10px; font-weight: 650; }

/* ---------- side panel ---------- */
.panel-mask { position: fixed; inset: 0; background: rgba(9,20,45,.35); z-index: 60; }
.panel {
  position: fixed;
  top: 0; right: 0; bottom: 0;
  width: min(460px, 94vw);
  background: var(--surface);
  z-index: 61;
  box-shadow: -12px 0 40px rgba(9,20,45,.18);
  display: flex;
  flex-direction: column;
}
.panel .p-head { padding: 14px 18px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
.panel .p-head h3 { margin: 0; font-size: 15px; }
.panel .p-body { padding: 14px 18px; overflow-y: auto; flex: 1; }
.panel .p-foot { padding: 12px 18px; border-top: 1px solid var(--line); display: flex; gap: 8px; justify-content: flex-end; }

/* ---------- print ---------- */
@media print {

const d2 = iso => new Date(iso + 'T00:00:00');
function addDays(iso, n) {
  const d = d2(iso); d.setDate(d.getDate() + n);
  const p = x => String(x).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}
const diffDays = (a, b) => Math.round((d2(b) - d2(a)) / 86400000);

/* ---------- 时间线倒推（PRD §7.2） ---------- */
function recalcTimeline(p) {
  const D = {};
  const chain = ['14', '13', '11', '10', '09', '08', '07', '06', '05', '04', '03', '02', '01'];
  let cursor = p.deliveryDate;
  let bulkStart = null;
  chain.forEach(id => {
    const def = nodeDef(id);
    D[id] = cursor;
    cursor = addDays(cursor, -def.dur);
    if (id === '11') bulkStart = cursor;
  });
  D['12'] = addDays(bulkStart, 5); // DUPRO：大货开始后 +5 天（约完成 10%）
  p.nodes.forEach(n => { n.deadline = D[n.id]; });
  return D;
}

/* ---------- 存储 ---------- */
let db;
function loadDB() {
  try {
    const raw = localStorage.getItem(DB_KEY);
    if (raw) { db = JSON.parse(raw); return; }
  } catch (e) { /* ignore */ }
  db = seed();
  saveDB();
}
function saveDB() {
  try { localStorage.setItem(DB_KEY, JSON.stringify(db)); } catch (e) { /* ignore */ }
}
function resetDemo() {
  try { localStorage.removeItem(DB_KEY); } catch (e) { /* ignore */ }
  db = seed(); saveDB();
  ui.overlay = null; ui.panel = null;
  location.hash = '#/projects';
  render();
  toast('演示数据已重置', true);
}

function statusPill(n) {
  const over = isOverdue(n);
  const def = nodeDef(n.id);
  let label = STATUS_LABEL[n.status];
  if (n.status === 'review' && def.confirm) label = '待审批 / 待确认';
  return `<span class="pill s-${n.status}">${label}</span>${over ? '<span class="pill s-overdue">已逾期</span>' : ''}`;
}
function avatarOf(name) { return `<span class="who"><span class="avatar">${esc(String(name).slice(0, 1))}</span>${esc(name)}</span>`; }

function lanesHtml(p, clickable) {
  const cur = currentNode(p);
  const groups = { dev: [], pre: [], end: [] };
  p.nodes.forEach(n => groups[nodeDef(n.id).phase].push(n));
  return `<div class="lanes">` + Object.keys(groups).map(ph => `
    <div class="lane ph-${ph}">
      <div class="lane-tag"><i></i>${PHASES[ph].label}<span>${PHASES[ph].en}</span></div>
      <div class="lane-chips">
        ${groups[ph].map(n => {
          const def = nodeDef(n.id);
          const over = isOverdue(n);
          const dc = doneCount(p, n);
          return `<div class="nchip ${n.id === cur.id ? 'cur' : ''} ${clickable ? '' : 'disabled'}"
            ${clickable ? `data-act="goto" data-href="#/projects/${p.id}/node/${n.id}"` : ''}>
            <span class="l1"><span class="no">${n.id}</span>${def.name}</span>
            <span class="l2"><span class="dot s-${n.status}"></span>${dc}/${p.skus.length}
              <span class="${over ? 'over' : ''}">${fmtD(n.deadline)}${over ? ' 逾期' : ''}</span></span>
          </div>`;
        }).join('')}
      </div>
    </div>`).join('') + `</div>`;
}

/* ---------- 首页（内部） ---------- */
function projectRow(p) {
  const cur = currentNode(p);
  const overs = p.nodes.filter(isOverdue);
  const done = p.nodes.filter(n => n.status === 'done').length;
  const pct = Math.round(done / p.nodes.length * 100);
  const toDelivery = diffDays(TODAY, p.deliveryDate);
  const curOver = isOverdue(cur);
  const curDays = diffDays(TODAY, cur.deadline);
  const groups = { dev: [], pre: [], end: [] };
  p.nodes.forEach(n => groups[nodeDef(n.id).phase].push(n));

  return `<div class="card prow mt" data-act="goto" data-href="#/projects/${p.id}">
    <div class="prow-head">
      <span class="name">${esc(p.name)}</span>
      <span class="tag b">${esc(p.client)}</span><span class="tag">${esc(p.season)}</span>
      ${overs.length ? `<span class="tag r">${overs.length} 个节点逾期</span>` : ''}
      <span style="flex:1"></span>
      <span class="tag ${pct >= 60 ? 'm' : ''}">进度 ${done}/${p.nodes.length} · ${pct}%</span>
    </div>
    <div class="prow-meta">
      <span>交期 <b>${p.deliveryDate}</b>（${toDelivery >= 0 ? `剩 ${toDelivery} 天` : `<b class="over">已过 ${-toDelivery} 天</b>`}）</span>
      <span>SKU <b>${p.skus.length}</b></span>
      <span>负责人 ${avatarOf(person(p.ownerId).name)}</span>
    </div>
    <div class="flowbar">
      ${['dev', 'pre', 'end'].map(ph => `<span class="grp g-${ph}">
        ${groups[ph].map(n => `<i class="seg f-${isOverdue(n) ? 'overdue' : n.status} ${n.id === cur.id ? 'cur' : ''}"
          title="${n.id} ${nodeDef(n.id).name} · ${STATUS_LABEL[n.status]}${isOverdue(n) ? ' · 已逾期' : ''}"
          data-act="goto" data-href="#/projects/${p.id}/node/${n.id}"></i>`).join('')}
      </span>`).join('')}
    </div>
    <div class="phase-ticks"><span class="g-dev">开发 01–07</span><span class="g-pre">产前 08–10</span><span class="g-end">尾期 11–14</span></div>
    <div class="flow-legend">
      当前节点 <b>${cur.id} ${nodeDef(cur.id).name}</b> · ${STATUS_LABEL[cur.status]} ·
      deadline ${cur.deadline}
      ${curOver ? `<span class="tag r">逾期 ${-curDays} 天</span>` : `<span class="tag">剩 ${curDays} 天</span>`}
    </div>
  </div>`;
}

function viewHome() {
  const projs = db.projects.filter(p => p.status === 'active');
  const allActive = [];
  projs.forEach(p => activeNodes(p).forEach(n => allActive.push({ p, n })));
  const overdue = allActive.filter(x => isOverdue(x.n));
  const reviews = allActive.filter(x => x.n.status === 'review');
  allActive.sort((a, b) => (isOverdue(b.n) - isOverdue(a.n)) || (a.n.deadline < b.n.deadline ? -1 : 1));

  const F = ui.homeFilter;
  const list = F === 'overdue' ? overdue : F === 'review' ? reviews : allActive;
  const worst = overdue.length
    ? overdue.reduce((a, b) => diffDays(a.n.deadline, TODAY) >= diffDays(b.n.deadline, TODAY) ? a : b)
    : null;

  return `
  <div class="page-head"><h1>项目总览</h1><span class="sub">客户：HEMA ｜ 点击统计卡可筛选下方待办</span></div>
  <div class="grid g4">
    <div class="card statcard brand"><div class="num">${projs.length}</div><div class="lbl">进行中项目</div>
      <div class="hint">${projs.reduce((s, p) => s + p.skus.length, 0)} 个 SKU 在手</div></div>
    <div class="card statcard click ${F === 'all' ? 'on' : ''}" data-act="home-filter" data-f="all">
      <div class="num">${allActive.length}</div><div class="lbl">待处理节点</div><div class="hint">进行中 + 待审批</div></div>
    <div class="card statcard click ${F === 'review' ? 'on' : ''}" data-act="home-filter" data-f="review">
      <div class="num" style="color:var(--amber)">${reviews.length}</div><div class="lbl">待审批 / 待客户确认</div>
      <div class="hint">卡在审批环节</div></div>
    <div class="card statcard warn click ${F === 'overdue' ? 'on' : ''}" data-act="home-filter" data-f="overdue">
      <div class="num">${overdue.length}</div><div class="lbl">已逾期节点</div>
      <div class="hint">${worst ? `最长逾期 ${diffDays(worst.n.deadline, TODAY)} 天` : '全部按期'}</div></div>
  </div>
  ${worst ? `<div class="riskbar mt" data-act="goto" data-href="#/projects/${worst.p.id}/node/${worst.n.id}">
    ⚠ ${overdue.length} 个节点逾期，最长逾期 ${diffDays(worst.n.deadline, TODAY)} 天
    <span class="cool">最紧急：${esc(worst.p.name)} · ${worst.n.id} ${nodeDef(worst.n.id).name} · ${esc(person(worst.n.ownerId).name)}</span>
    <span class="go">立即处理 →</span></div>` : ''}

  <div class="page-head" style="margin:26px 0 0"><h1 style="font-size:16px">项目</h1>
    <span class="sub">点击节点条上任一段可直接进入该节点</span></div>
  ${projs.map(projectRow).join('')}

  <div class="card mt">
    <div class="todo-head">
      <h3 style="margin:0">待处理事项 <span class="tag">逾期置顶 · 按 deadline 排序</span></h3>
      <div class="tabs">
        <button class="${F === 'all' ? 'on' : ''}" data-act="home-filter" data-f="all">全部 ${allActive.length}</button>
        <button class="${F === 'review' ? 'on' : ''}" data-act="home-filter" data-f="review">待审批 ${reviews.length}</button>
        <button class="${F === 'overdue' ? 'on' : ''}" data-act="home-filter" data-f="overdue">仅逾期 ${overdue.length}</button>
      </div>
    </div>
    ${list.length ? list.map(({ p, n }) => {
      const over = isOverdue(n);
      const left = diffDays(TODAY, n.deadline);
      return `<div class="todo-item" data-act="goto" data-href="#/projects/${p.id}/node/${n.id}">
        <span class="dot s-${n.status}"></span>
        <span><span class="t-name">${n.id} ${nodeDef(n.id).name}</span> ${statusPill(n)}</span>
        <span class="t-proj">${esc(p.name)} · ${avatarOf(person(n.ownerId).name)}</span>
        <span class="t-dl ${over ? 'over' : ''}">${n.deadline} · ${over ? `逾期 ${-left} 天` : `剩 ${left} 天`}</span>
      </div>`;
    }).join('') : `<div class="empty">${F === 'overdue' ? '没有逾期节点 🎉' : F === 'review' ? '没有待审批事项' : '暂无待处理事项'}</div>`}
  </div>`;
}

/* ---------- 项目详情（内部） ---------- */

  const cur = currentNode(p);
  const overs = p.nodes.filter(isOverdue);
  return `
  <div class="crumb"><a href="#/projects">项目管理</a> / <b>${esc(p.name)}</b></div>

    <h1>${esc(p.name)}</h1>
    <span class="tag b">${esc(p.client)}</span><span class="tag">${esc(p.season)}</span>

  </div>
  <div class="card">
    <h3>工作流 <span class="tag">三大阶段 · 14 节点 · 点击进入节点</span></h3>
    ${lanesHtml(p, true)}
    <div class="hintbar">当前节点：<b>${cur.id} ${nodeDef(cur.id).name}</b> · ${STATUS_LABEL[cur.status]}
      <span>下一步：${cur.todos.filter(t => !t.done).map(t => esc(t.t)).join('；') || '推进本节点至完成'}</span></div>

      `<span>${n.id} ${nodeDef(n.id).name}（逾期 ${diffDays(n.deadline, TODAY)} 天 · ${esc(person(n.ownerId).name)}）</span>`).join('')}</div>` : ''}
  </div>`;

/* ---------- 节点详情 ---------- */
function viewNode(p, n) {
  const def = nodeDef(n.id);
  const over = isOverdue(n);
  const dc = doneCount(p, n);
  const days = diffDays(TODAY, n.deadline);

  let actions = '';
  if (canEdit()) {
    if (n.status === 'pending') actions = `<button class="btn pri" data-act="n-start">开始节点</button>`;
    else if (n.status === 'in_progress') actions = `<button class="btn pri" data-act="n-submit">提交审批</button>`;
    else if (n.status === 'review') actions = `
      <button class="btn mint" data-act="n-approve">审批通过</button>
      <button class="btn danger" data-act="n-reject">驳回</button>`;
    else actions = `<span class="badge-final">节点已完成</span>`;
  }

  return `
  <div class="crumb"><a href="#/projects">项目管理</a> / <a href="#/projects/${p.id}">${esc(p.name)}</a> / <b>${n.id} ${def.name}</b></div>
  <div class="card node-headcard">
    <span class="big"><span class="code">${def.code}</span>${def.name}</span>
    <span class="tag ${def.phase === 'dev' ? 'b' : def.phase === 'pre' ? 'k' : 'm'}">${PHASES[def.phase].label}</span>
    ${statusPill(n)}
    <span class="kv">deadline <b class="${over ? 'over' : ''}">${n.deadline}</b>
      ${n.status === 'done' ? '' : over ? `<b class="over">（逾期 ${diffDays(n.deadline, TODAY)} 天）</b>` : `（剩 ${days} 天）`}</span>
    <span class="kv">负责人 ${avatarOf(person(n.ownerId).name)}</span>
    ${n.reviewerId ? `<span class="kv">审批 / 确认 ${avatarOf(person(n.reviewerId).name)}</span>` : ''}
    <span style="flex:1"></span>
    <span class="btnrow">${actions}</span>
  </div>
  ${ui.rejectOpen && n.status === 'review' ? `
  <div class="card mt reject-box">
    <h3>驳回原因（必填）</h3>
    <textarea class="ipt" id="rejectReason" placeholder="请说明驳回原因，将写入审批记录…"></textarea>
    <div class="btnrow mt"><button class="btn danger" data-act="n-reject-confirm">确认驳回</button>
    <button class="btn ghost" data-act="n-reject-cancel">取消</button></div>
  </div>` : ''}
  ${specificArea(p, n)}
  <div class="grid g3 mt">
    <div class="card"><h3>输入资料</h3>
      ${n.inputs.length ? n.inputs.map(f => `<div class="file-item">📄 ${esc(f)}<span class="tag" style="margin-left:auto">占位</span></div>`).join('') : '<div class="empty">暂无输入资料</div>'}
    </div>
    <div class="card"><h3>待办清单 <span class="tag">${n.todos.filter(t => t.done).length}/${n.todos.length}</span></h3>
      ${n.todos.length ? n.todos.map((t, i) => `
        <label class="chk ${t.done ? 'done' : ''}"><input type="checkbox" ${t.done ? 'checked' : ''} ${canEdit() ? '' : 'disabled'} data-chg="todo" data-i="${i}"><span>${esc(t.t)}</span></label>`).join('') : '<div class="empty">暂无待办</div>'}
    </div>
    <div class="card"><h3>版本记录</h3>
      ${n.versions.length ? n.versions.map(v => `<div class="ver"><span class="v">${esc(v.v)}</span><span>${esc(v.note)}</span><span class="d">${esc(v.time)} · ${esc(v.author)}</span></div>`).join('') : '<div class="empty">暂无版本记录</div>'}
    </div>
  </div>
  <div class="card mt">
    <h3>SKU 完成度 <span class="tag b">已完成 ${dc} / 共 ${p.skus.length}</span></h3>
    <div class="tbl-wrap"><table class="tbl">
      <thead><tr><th>货号</th><th>品名</th><th>品类</th><th>本节点状态</th></tr></thead>
      <tbody>${p.skus.map(s => `
        <tr><td class="num">${esc(s.artNo)}</td><td>${s.ph} ${esc(s.name)}</td><td><span class="tag">${CATS[s.cat]}</span></td>
        <td>${canEdit() ? `<button class="btn sm ${n.skuDone[s.id] ? 'mint' : ''}" data-act="sku-toggle" data-sku="${s.id}">
          ${n.skuDone[s.id] ? '✓ 已完成' : '未完成 · 点击标记'}</button>` : (n.skuDone[s.id] ? '✓ 已完成' : '未完成')}</td></tr>`).join('')}
      </tbody></table></div>
  </div>
  <div class="card mt">
    <h3>审批 / Comments</h3>
    ${n.comments.length ? n.comments.map(c => `
      <div class="cmt"><div class="h">${avatarOf(c.author)}<span class="tag">${esc(c.role)}</span><span class="t">${esc(c.time)}</span></div>
      <p>${esc(c.text)}</p></div>`).join('') : '<div class="empty">暂无记录</div>'}
    ${canEdit() ? `<div class="btnrow mt"><input class="ipt" id="cmtBox" placeholder="追加一条 comment…" style="flex:1">
      <button class="btn" data-act="add-comment">发送</button></div>` : ''}
  </div>`;
}

/* ---------- 节点专属功能区 ---------- */
function specificArea(p, n) {
  if (n.id === '01') return areaBrief(p, n);
  if (n.id === '03') return areaPsfList(p);
  if (n.id === '05') return areaTender(p, n);
  if (n.id === '07') return areaFS(p, n);
  if (n.id === '12' || n.id === '13') return areaInspect(p, n);
  return '';
}

function areaBrief(p) {
  const q = ui.briefFilter.trim().toUpperCase();
  const list = p.skus.filter(s => !q || s.artNo.toUpperCase().includes(q) || CATS[s.cat].includes(q) || s.name.includes(q));
  return `
  <div class="card mt">
    <h3>Brief · SKU 清单 <span class="tag">筛选编号，品类就出来了</span></h3>
    <div class="filterbar">
      <input class="ipt search" placeholder="按货号 / 品类筛选，如 HM-NB" value="${esc(ui.briefFilter)}" data-chg="brief-filter">
      ${canEdit() ? `<button class="btn" data-act="recalc">按交期倒推重算时间线</button>` : ''}
      <span class="note-strip">命中 ${list.length} / ${p.skus.length} 款</span>
    </div>
    <div class="tbl-wrap"><table class="tbl">
      <thead><tr><th>货号</th><th>品名</th><th>品类</th><th>客户目标价</th></tr></thead>
      <tbody>${list.map(s => `<tr><td class="num">${esc(s.artNo)}</td><td>${s.ph} ${esc(s.name)}</td>
        <td><span class="tag">${CATS[s.cat]}</span></td><td class="num">$${s.target.toFixed(2)}</td></tr>`).join('')}</tbody>
    </table></div>
  </div>`;
}

function areaPsfList(p) {
  return `
  <div class="card mt">
    <h3>PSF 规格书 <span class="tag b">底层核心 · 每 SKU 一份</span></h3>
    <div class="tbl-wrap"><table class="tbl">
      <thead><tr><th>货号</th><th>品名</th><th>版本</th><th>状态</th><th></th></tr></thead>
      <tbody>${p.skus.map(s => {
        const f = db.psfs[s.id];
        return `<tr><td class="num">${esc(s.artNo)}</td><td>${s.ph} ${esc(s.name)}</td>
        <td class="num">${f ? esc(f.version) : '—'}</td>
        <td>${f && f.locked ? '<span class="badge-final">FINAL 已锁定</span>' : '<span class="tag a">编辑中</span>'}</td>
        <td><button class="btn sm" data-act="goto" data-href="#/projects/${p.id}/psf/${s.id}">打开 PSF</button></td></tr>`;
      }).join('')}</tbody>
    </table></div>
  </div>`;
}

function areaTender(p, n) {
  const cqvs = db.cqv.filter(c => c.projectId === p.id);
  return `
  <div class="card mt">
    <h3>供应商匹配 & 一轮报价 <span class="tag">匹配内嵌在产品行 · 无独立工作台</span></h3>
    <div class="btnrow" style="margin-bottom:12px">
      <button class="btn pri" data-act="ovl-supquotes">按供应商导出报价单</button>
      <button class="btn" data-act="ovl-ppt">一键生成样品 PPT</button>
    </div>
    <div class="tbl-wrap"><table class="tbl">
      <thead><tr><th>货号</th><th>品名</th><th>品类</th><th>目标价</th><th>对客报价</th><th>候选供应商</th><th></th></tr></thead>
      <tbody>${p.skus.map(s => `
        <tr><td class="num">${esc(s.artNo)}</td><td>${s.ph} ${esc(s.name)}</td><td><span class="tag">${CATS[s.cat]}</span></td>
        <td class="num">$${s.target.toFixed(2)}</td><td class="num">$${s.quote.toFixed(2)}</td>
        <td>${s.cand.length ? s.cand.map(id => `<span class="tag b">${esc(supplier(id).name)}</span>`).join(' ') : '<span class="tag">未匹配</span>'}</td>
        <td>${canEdit() ? `<button class="btn sm" data-act="match-open" data-sku="${s.id}">匹配</button>` : ''}</td></tr>`).join('')}
      </tbody></table></div>
    <h3 class="mt">CQV 开发样评估（寄样前完成）</h3>
    ${cqvs.length ? `<div class="tbl-wrap"><table class="tbl">
      <thead><tr><th>SKU</th><th>评估项</th><th>结论</th><th>备注</th><th>评估人</th></tr></thead>
      <tbody>${cqvs.map(c => `<tr><td class="num">${esc(c.sku)}</td><td>${esc(c.item)}</td>
        <td>${c.result === '通过' ? '<span class="tag m">通过</span>' : `<span class="tag a">${esc(c.result)}</span>`}</td>
        <td>${esc(c.note)}</td><td>${esc(c.by)}</td></tr>`).join('')}</tbody></table></div>` : '<div class="empty">暂无评估记录</div>'}
    <h3 class="mt">样品照片墙（占位）</h3>
    <div class="prod-grid">${p.skus.slice(0, 4).map(s => `<div class="prod"><div class="ph">${s.ph}</div>
      <div class="a">${esc(s.artNo)}</div><div class="n">${esc(s.name)}</div><div class="m">样品照片占位</div></div>`).join('')}</div>
  </div>`;
}

function areaFS(p, n) {
  const locked = !!n.fsLocked;
  return `
  <div class="card mt">
    <h3>FS 汇总表 <span class="tag b">供应链透明化 · 每款填明工厂</span>
      ${locked ? '<span class="badge-final">FINAL 已锁定</span>' : ''}
      <span style="flex:1"></span>
      ${canEdit() ? (locked
        ? `<button class="btn sm" data-act="fs-unlock">解锁（需原因）</button>`
        : `<button class="btn sm pri" data-act="fs-lock">锁定 Final 版本</button>`) : ''}
    </h3>
    ${ui.fsUnlockOpen && locked ? `<div class="reject-box">
      <input class="ipt" id="fsReason" placeholder="解锁原因（将写入版本记录）…">
      <div class="btnrow mt"><button class="btn danger" data-act="fs-unlock-confirm">确认解锁</button>
      <button class="btn ghost" data-act="fs-unlock-cancel">取消</button></div></div>` : ''}
    <div class="tbl-wrap"><table class="tbl">
      <thead><tr><th>货号</th><th>品名</th><th>对客价</th><th>最终供应商（从候选带入）</th></tr></thead>
      <tbody>${p.skus.map(s => {
        const opts = (s.cand.length ? s.cand : db.suppliers.filter(x => x.categories.includes(s.cat)).map(x => x.id));
        return `<tr><td class="num">${esc(s.artNo)}</td><td>${s.ph} ${esc(s.name)}</td><td class="num">$${s.quote.toFixed(2)}</td>
        <td>${canEdit() && !locked ? `<select class="ipt ipt-inline" data-chg="fs-final" data-sku="${s.id}">
          <option value="">— 未指定 —</option>
          ${opts.map(id => `<option value="${id}" ${s.final === id ? 'selected' : ''}>${esc(supplier(id).name)}</option>`).join('')}
        </select>` : (s.final ? `<span class="tag b">${esc(supplier(s.final).name)}</span>` : '<span class="tag">未指定</span>')}
        ${s.cand.length ? `<span class="tag" style="margin-left:6px">候选 ${s.cand.length}</span>` : ''}</td></tr>`;
      }).join('')}</tbody></table></div>
    <p class="note-strip mt">锁定后表格只读；解锁必须填写原因并写入版本记录——对应「FS 改来改去，改得不正确了」的痛点。</p>
  </div>`;
}

function areaInspect(p, n) {
  const recs = db.inspections.filter(r => r.projectId === p.id && r.nodeId === n.id);
  const kind = n.id === '12' ? 'DUPRO · 中期验货（大货完成约 10% 时）' : 'FRI · 大货验货（大货完成后）';
  return `
  <div class="card mt">
    <h3>验货记录 <span class="tag k">${kind}</span></h3>
    ${recs.length ? recs.map(r => `

/* ---------- 管理者看板 ---------- */
function viewDashboard() {
  const projs = db.projects.filter(p => p.status === 'active');

  projs.forEach(p => p.nodes.filter(isOverdue).forEach(n => overs.push({ p, n })));

    const nm = person(n.ownerId).name;
    byOwner[nm] = (byOwner[nm] || 0) + 1;

  const maxR = ranks.length ? ranks[0][1] : 1;
  return `

      <tbody>${projs.map(p => `<tr><td class="pname">${esc(p.name)}</td>

      </tbody></table></div>
    <div class="legend">
      <span><i style="background:var(--surface-2)"></i>未开始</span>
      <span><i style="background:var(--brand)"></i>进行中</span>
      <span><i style="background:var(--amber)"></i>待审批</span>
      <span><i style="background:var(--mint)"></i>已完成</span>
      <span><i style="background:var(--surface-2);box-shadow:inset 0 0 0 2px var(--red)"></i>逾期</span>
    </div>
  </div>
  <div class="grid g2 mt">
    <div class="card"><h3>逾期清单</h3>
      ${overs.length ? `<div class="tbl-wrap"><table class="tbl">
        <thead><tr><th>项目</th><th>节点</th><th>负责人</th><th>deadline</th><th>逾期</th></tr></thead>
        <tbody>${overs.map(({ p, n }) => `<tr>
          <td>${esc(p.name)}</td><td><a href="#/projects/${p.id}/node/${n.id}">${n.id} ${nodeDef(n.id).name}</a></td>

/* ============================================================
   路由 & 渲染入口
   ============================================================ */

function render() {
  const parts = (location.hash || '#/projects').replace(/^#\//, '').split('/');
  let key = parts[0] || 'projects';

  // 视角守卫
  if (isClient() && !['projects'].includes(key)) { location.hash = '#/projects'; return; }
  if (key === 'dashboard' && isClient()) { location.hash = '#/projects'; return; }

  let body = '';
  if (key === 'dashboard') body = viewDashboard();
  else if (key === 'suppliers') body = viewSuppliers();
  else if (key === 'quality') body = viewQuality();
  else if (key === 'clients') body = viewClients();
  else if (key === 'projects') {
    const p = parts[1] ? proj(parts[1]) : null;
    if (!p) body = isClient() ? viewClientHome() : viewHome();
    else if (parts[2] === 'node' && parts[3]) {
      if (isClient()) { location.hash = '#/projects/' + p.id; return; }
      const n = nodeOf(p, parts[3]);
      body = n ? viewNode(p, n) : viewHome();
    } else if (parts[2] === 'psf' && parts[3]) {
      if (isClient()) { location.hash = '#/projects/' + p.id; return; }
      const s = skuOf(p, parts[3]);
      body = s ? viewPSF(p, s) : viewHome();
    } else body = isClient() ? viewClientProject(p) : viewProject(p);
  } else body = viewHome();

  $('#app').innerHTML = shell(key, body) + renderPanel();
  $('#overlay-root').innerHTML = renderOverlay();
}

/* ---------- toast ---------- */
function toast(msg, ok) {
  const el = document.createElement('div');
  el.className = 'toast' + (ok ? ' ok' : '');
  el.textContent = msg;
  $('#toast-root').appendChild(el);
  setTimeout(() => el.remove(), 2400);
}

/* ---------- 上下文取当前路由的项目/节点 ---------- */
function ctx() {
  const parts = (location.hash || '').replace(/^#\//, '').split('/');
  const p = parts[0] === 'projects' && parts[1] ? proj(parts[1]) : null;
  const n = p && parts[2] === 'node' && parts[3] ? nodeOf(p, parts[3]) : null;
  const s = p && parts[2] === 'psf' && parts[3] ? skuOf(p, parts[3]) : null;
  return { p, n, s };
}
function addCmt(n, author, role, text) {
  n.comments.push({ author, role, time: nowStamp(), text });
}

/* ---------- 事件：点击 ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t) return;
  const act = t.dataset.act;
  const { p, n, s } = ctx();

  if (act === 'goto') { location.hash = t.dataset.href; return; }
  if (act === 'home-filter') { ui.homeFilter = t.dataset.f; render(); return; }
  if (act === 'reset') { resetDemo(); return; }
  if (act === 'print') { window.print(); return; }
  if (act === 'ovl-close') { ui.overlay = null; render(); return; }
  if (act === 'ovl-close-bg') { if (e.target.classList.contains('ovl')) { ui.overlay = null; render(); } return; }
  if (act === 'panel-close') { ui.panel = null; render(); return; }

  /* 节点状态流转 */
  if (act === 'n-start' && n) { n.status = 'in_progress'; addCmt(n, person(n.ownerId).name, '业务', '节点已开始。'); saveDB(); render(); return; }
  if (act === 'n-submit' && n) { n.status = 'review'; addCmt(n, person(n.ownerId).name, '业务', '已提交审批 / 待客户确认。'); saveDB(); render(); toast('已提交审批'); return; }
  if (act === 'n-approve' && n) {
    n.status = 'done'; ui.rejectOpen = false;
    addCmt(n, n.reviewerId ? person(n.reviewerId).name : '管理员', '审批', '审批通过。');
    saveDB(); render(); toast('审批通过，节点完成', true); return;
  }
  if (act === 'n-reject' && n) { ui.rejectOpen = true; render(); return; }
  if (act === 'n-reject-cancel') { ui.rejectOpen = false; render(); return; }
  if (act === 'n-reject-confirm' && n) {
    const v = ($('#rejectReason') || {}).value || '';
    if (!v.trim()) { toast('驳回原因必填'); return; }
    n.status = 'in_progress'; ui.rejectOpen = false;
    addCmt(n, n.reviewerId ? person(n.reviewerId).name : '管理员', '审批', '【驳回】' + v.trim());
    saveDB(); render(); toast('已驳回，节点退回进行中'); return;
  }
  if (act === 'sku-toggle' && n && p) {
    const k = t.dataset.sku;
    n.skuDone[k] = !n.skuDone[k]; saveDB(); render(); return;
  }
  if (act === 'add-comment' && n) {
    const v = ($('#cmtBox') || {}).value || '';
    if (!v.trim()) return;
    addCmt(n, db.role === 'manager' ? '管理员' : person(n.ownerId).name, db.role === 'manager' ? '管理' : '业务', v.trim());
    saveDB(); render(); return;
  }
  if (act === 'recalc' && p) {
    recalcTimeline(p); saveDB(); render(); toast('已按交期 ' + p.deliveryDate + ' 倒推重算全部节点 deadline', true); return;
  }

  /* PSF */
  if (act === 'psf-lang') { ui.psfLang = t.dataset.l; render(); return; }
  if (act === 'psf-save' && s) {
    const f = db.psfs[s.id];
    const num = f.history.filter(h => h.ver.startsWith('V')).length + 1;
    f.version = 'V' + num;
    f.history.push({ ver: f.version, time: TODAY, author: '业务A', change: '手动保存修订' });
    saveDB(); render(); toast('已保存为 ' + f.version, true); return;
  }
  if (act === 'psf-lock' && s) {
    const f = db.psfs[s.id];
    f.locked = true; f.version = 'Final';
    f.history.push({ ver: 'Final', time: TODAY, author: '业务A', change: '锁定为最终版' });
    saveDB(); render(); toast('已锁定为 Final，编辑器只读', true); return;
  }
  if (act === 'psf-unlock') { ui.psfUnlockOpen = true; render(); return; }
  if (act === 'psf-unlock-cancel') { ui.psfUnlockOpen = false; render(); return; }
  if (act === 'psf-unlock-confirm' && s) {
    const v = ($('#psfReason') || {}).value || '';
    if (!v.trim()) { toast('解锁原因必填'); return; }
    const f = db.psfs[s.id];
    f.locked = false; ui.psfUnlockOpen = false;
    f.history.push({ ver: f.version + '→修订', time: TODAY, author: '业务A', change: '解锁：' + v.trim() });
    saveDB(); render(); toast('已解锁，请修订后重新锁定'); return;
  }
  if (act === 'ovl-import' && p && s) { ui.overlay = { kind: 'import', pid: p.id, skuId: s.id, parsing: false }; render(); return; }
  if (act === 'import-parse') {
    ui.overlay.parsing = true; render();
    setTimeout(() => {
      const o = ui.overlay; if (!o) return;
      const pp = proj(o.pid), ss = skuOf(pp, o.skuId);
      const f = db.psfs[ss.id];
      const tpl = psfTemplate(ss.cat);
      f.sections = { productDesc: tpl.desc, construction: tpl.cons, surface: tpl.surf, packaging: tpl.pack, compliance: tpl.comp };
      f.history.push({ ver: '导入', time: TODAY, author: '业务A', change: '导入客户 PSF 并自动分类（规格 / 包材 / 法规）' });
      ui.overlay = null; saveDB(); render();
      toast('导入完成：已自动分类并生成中文工厂版', true);
    }, 1000);
    return;
  }
  if (act === 'ovl-quote' && p && s) { ui.overlay = { kind: 'quote', pid: p.id, skuId: s.id }; render(); return; }
  if (act === 'ovl-order' && p && s) { ui.overlay = { kind: 'order', pid: p.id, skuId: s.id }; render(); return; }
  if (act === 'ovl-en' && p && s) { ui.overlay = { kind: 'en', pid: p.id, skuId: s.id }; render(); return; }

  /* Tender */
  if (act === 'match-open' && p) { ui.panel = { kind: 'match', pid: p.id, skuId: t.dataset.sku, sel: [...skuOf(p, t.dataset.sku).cand] }; render(); return; }
  if (act === 'match-save' && ui.panel) {
    const pp = proj(ui.panel.pid), ss = skuOf(pp, ui.panel.skuId);
    ss.cand = [...ui.panel.sel];
    ui.panel = null; saveDB(); render(); toast('候选供应商已保存（' + ss.cand.length + ' 家）', true); return;
  }
  if (act === 'ovl-supquotes' && p) { ui.overlay = { kind: 'supquotes', pid: p.id }; render(); return; }
  if (act === 'ovl-ppt' && p) { ui.overlay = { kind: 'ppt', pid: p.id }; render(); return; }

  /* FS */
  if (act === 'fs-lock' && n) {
    n.fsLocked = true;
    n.versions.push({ v: 'Final', time: TODAY, author: person(n.ownerId).name, note: 'FS 锁定为权威版本' });
    saveDB(); render(); toast('FS 已锁定 Final', true); return;
  }
  if (act === 'fs-unlock') { ui.fsUnlockOpen = true; render(); return; }
  if (act === 'fs-unlock-cancel') { ui.fsUnlockOpen = false; render(); return; }
  if (act === 'fs-unlock-confirm' && n) {
    const v = ($('#fsReason') || {}).value || '';
    if (!v.trim()) { toast('解锁原因必填'); return; }
    n.fsLocked = false; ui.fsUnlockOpen = false;
    n.versions.push({ v: '解锁', time: TODAY, author: person(n.ownerId).name, note: '解锁：' + v.trim() });
    saveDB(); render(); toast('FS 已解锁，改动将留痕'); return;
  }

  /* 客户视角 */
  if (act === 'client-confirm' && p) {
    const nn = nodeOf(p, t.dataset.n);
    nn.status = 'done'; addCmt(nn, 'HEMA 买手', '客户', '已确认。');
    saveDB(); render(); toast('已确认，我方将进入下一环节', true); return;
  }
  if (act === 'client-change') { ui.clientChangeFor = ui.clientChangeFor === t.dataset.n ? null : t.dataset.n; render(); return; }
  if (act === 'client-change-send' && p) {
    const v = ($('#ccText') || {}).value || '';
    if (!v.trim()) { toast('请填写修改意见'); return; }
    const nn = nodeOf(p, t.dataset.n);
    nn.status = 'in_progress'; ui.clientChangeFor = null;
    addCmt(nn, 'HEMA 买手', '客户', '【修改意见】' + v.trim());
    saveDB(); render(); toast('修改意见已发送，节点退回进行中', true); return;
  }
  if (act === 'ovl-en-c' && p) { ui.overlay = { kind: 'en', pid: p.id, skuId: t.dataset.sku }; render(); return; }
  if (act === 'ovl-ppt-c') { ui.overlay = { kind: 'ppt', pid: t.dataset.p }; render(); return; }
  if (act === 'ovl-fslist') { ui.overlay = { kind: 'fslist', pid: t.dataset.p }; render(); return; }

  /* 供应商 / 质量 / 客户板块 */
  if (act === 'sup-detail') { ui.panel = { kind: 'supplier', id: t.dataset.id }; render(); return; }
  if (act === 'sup-import') { toast('批量导入为二期能力（演示占位）'); return; }
  if (act === 'qtab') { ui.qualityTab = t.dataset.t; render(); return; }
  if (act === 'prod-detail') { ui.overlay = { kind: 'prod', id: t.dataset.id }; render(); return; }
  if (act === 'copy-desc') {
    const x = db.clientProducts.find(y => y.id === t.dataset.id);
    const txt = x.artNo + ' ' + x.name + '：' + x.desc;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).then(() => toast('标准描述已复制到剪贴板', true), () => toast('复制失败'));
    } else toast('当前环境不支持剪贴板');
    return;
  }
});

/* ---------- 事件：表单变更 ---------- */
document.addEventListener('change', e => {
  const t = e.target.closest('[data-chg]');
  if (!t) return;
  const k = t.dataset.chg;
  const { p, n, s } = ctx();

  if (k === 'role') {
    db.role = t.value; saveDB();
    ui.overlay = null; ui.panel = null; ui.rejectOpen = false;
    location.hash = t.value === 'manager' ? '#/dashboard' : '#/projects';
    render(); return;
  }
  if (k === 'todo' && n) { n.todos[+t.dataset.i].done = t.checked; saveDB(); render(); return; }
  if (k === 'psf' && s) {
    const f = db.psfs[s.id];
    const path = t.dataset.path.split('.');
    let obj = f.sections;
    for (let i = 0; i < path.length - 1; i++) obj = obj[path[i]];
    obj[path[path.length - 1]] = t.value;
    f.updatedTime = TODAY; saveDB(); return;
  }
  if (k === 'fs-final' && p) { skuOf(p, t.dataset.sku).final = t.value || null; saveDB(); render(); return; }
  if (k === 'match-sel' && ui.panel) {
    const id = t.dataset.id;
    const sel = ui.panel.sel;
    if (t.checked) {
      if (sel.length >= 3) { toast('最多选择 3 家候选'); render(); return; }
      sel.push(id);
    } else ui.panel.sel = sel.filter(x => x !== id);
    render(); return;
  }
  if (k === 'brief-filter') { ui.briefFilter = t.value; render(); return; }
  if (k === 'sup-client') { ui.supFilter.client = t.value; render(); return; }
  if (k === 'sup-cat') { ui.supFilter.cat = t.value; render(); return; }
  if (k === 'sup-q') { ui.supFilter.q = t.value; render(); return; }
  if (k === 'pf-year') { ui.prodFilter.year = t.value; render(); return; }
  if (k === 'pf-project') { ui.prodFilter.project = t.value; render(); return; }
  if (k === 'pf-cat') { ui.prodFilter.cat = t.value; render(); return; }
  if (k === 'pf-q') { ui.prodFilter.q = t.value; render(); return; }
});

/* 输入即时筛选 */
document.addEventListener('input', e => {
  const t = e.target.closest('[data-chg="brief-filter"],[data-chg="sup-q"],[data-chg="pf-q"]');
  if (!t) return;
  const k = t.dataset.chg;
  const v = t.value;
  const st = t.selectionStart;
  if (k === 'brief-filter') ui.briefFilter = v;
  if (k === 'sup-q') ui.supFilter.q = v;
  if (k === 'pf-q') ui.prodFilter.q = v;
  render();
  const nt = document.querySelector(`[data-chg="${k}"]`);
  if (nt) { nt.focus(); nt.setSelectionRange(st, st); }
});

/* ---------- 初始化 ---------- */
loadDB();
window.addEventListener('hashchange', () => { ui.rejectOpen = false; ui.fsUnlockOpen = false; ui.psfUnlockOpen = false; render(); });
render();
</script>
</body>
</html>
